name: Deploy demo

# Redeploy the public sandbox from the newest commit on `main`.
#
# The self-hosted runner mounts the host Docker daemon (/var/run/docker.sock),
# so `docker` here manages containers on ODIN directly - no registry push, no
# SSH, no watchtower. `main` is the image: every merged commit is rebuilt and
# the container is recreated in place.
#
# The container is bound to 127.0.0.1:8001 and reached through the Cloudflare
# Tunnel ingress for packetforge-demo.jayw.uk (see the tunnel config on ODIN).
# Boards persist in /mnt/user/appdata/packetforge-demo so a redeploy does not
# wipe the canvas.
#
# This job does not publish an image: there is no container registry in the
# loop, so there is nothing to rotate and nothing to go stale between merges.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A burst of merges should produce the newest demo, not five racing recreations
# of the same container. Cancel-in-progress keeps the queue at one deploy.
concurrency:
  group: deploy-demo
  cancel-in-progress: true

jobs:
  demo:
    name: Rebuild and redeploy the demo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # node:20-bookworm ships no docker binary; the runner mounts the host
      # daemon, so installing the CLI is enough to drive it. Same as ci.yml.
      - name: Install Docker CLI
        run: apt-get update && apt-get install -y docker.io

      - name: Build image from main
        run: docker build -t packetforge:demo .

      - name: Recreate the container
        run: |
          # The app runs as the unprivileged `node` user (uid 1000); make its
          # data directory writable so saved boards survive this recreate.
          docker run --rm -u 0 -v /mnt/user/appdata/packetforge-demo:/data \
            packetforge:demo chown -R 1000:1000 /data
          docker rm -f packetforge-demo || true
          docker run -d \
            --name packetforge-demo \
            --restart unless-stopped \
            -p 127.0.0.1:8001:8000 \
            -e PORT=8000 \
            -e PF_DATA=/data \
            -v /mnt/user/appdata/packetforge-demo:/data \
            packetforge:demo

      - name: Wait until healthy
        run: |
          for i in $(seq 1 24); do
            h=$(docker inspect -f '{{.State.Health.Status}}' packetforge-demo 2>/dev/null || echo missing)
            [ "$h" = "healthy" ] && { echo "demo healthy"; exit 0; }
            sleep 5
          done
          echo "demo did not become healthy (last state: $h)" >&2
          docker logs --tail 40 packetforge-demo || true
          exit 1
