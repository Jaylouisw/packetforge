name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Merging through the API does not reach the runner as a push event, so `main`
  # is the branch nothing verifies. This makes that a choice rather than a gap:
  # the same matrix can be run against any branch on demand.
  workflow_dispatch:

permissions:
  contents: read

# A pull request that gets rebased or amended starts a new run, but the run it
# superseded stays in the queue and is still executed. On this host there is a
# single runner, so those dead runs are not free: they are the difference between
# the queue draining in hours and in days, and they report on a commit nobody
# will merge. Cancel the superseded run instead of paying for it.
#
# Pushes to main are never cancelled - each one describes a different commit and
# a cancelled push run is a gap in the history of the default branch.
#
# Group by pull request, not by branch. Two runs of the same PR are the same
# question asked twice - the newer wins, so the older is cancelled. Two runs on
# `main` are different questions: each one verifies a different commit, and a
# cancelled one is a commit nobody ever tested.
#
# `github.event.pull_request.number || github.sha` does both. It previously fell
# back to `github.ref`, which is `refs/heads/main` for every push - so every
# post-merge verification shared one group, and as soon as merges got quick they
# started cancelling each other. Measured on 2026-11-08 after the runner's
# capacity was doubled: runs 672, 674 and 675 are three consecutive pushes to
# main, all cancelled before starting, inside two minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decide what the diff can actually break, before spending runner slots on it.
  #
  # The catalogue work is the bulk of this project's pull requests and it is almost always
  # additive JSON: a device spec, a registry count, a note. That diff cannot change how the
  # server boots, how the simulator forwards, or whether the image builds - the worst it can
  # do is fail the catalogue invariants, which `npm test` checks. Paying five runner slots
  # (three Node versions, a smoke test, a Docker build) to learn that is how a two-runner
  # host ends up with a queue that never reaches the next pull request.
  #
  # Classification is deliberately hostile to the "skip" answer: anything this job cannot
  # identify - an empty diff, an unknown base sha, a shallow clone - is treated as a code
  # change and runs everything.
  changes:
    name: Classify the change
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      data_only: ${{ steps.classify.outputs.data_only }}
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "${BASE_SHA:-}" ]; then
            git fetch -q origin "$BASE_SHA" || true
            node scripts/classify-change.js --base "$BASE_SHA" --head HEAD
          else
            node scripts/classify-change.js --base ""
          fi

  # A job that hangs holds the only runner, and a held runner is a queue that
  # stops moving: issue #930 documents a task stuck in `running` for over forty
  # minutes while every other pull request waited behind it. A bound does not make
  # the job faster, it makes the failure cost ten minutes instead of an afternoon.
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    # A data-only diff runs one Node version instead of three. The suite is the same suite,
    # so the invariants that a device spec can break are still checked - just once.
    if: needs.changes.outputs.data_only != 'true' || matrix.node == 20
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check (all JS)
        run: node scripts/syntax-check.js
      - name: No control bytes in source
        run: node scripts/check-control-bytes.js
      - name: No API newer than the Node 18 floor
        # A green suite on the newest Node means nothing for the oldest matrix job, and that
        # failure reads like a flaky runner rather than "you used a Node 20 API".
        run: node scripts/check-node-surface.js
      - name: Every project URL points at Forgejo
        # The project moved and the links did not follow: the README said to clone from GitHub and
        # SECURITY.md sent reports to a GitHub advisory page. Nothing failed, because a stale URL
        # looks like every other string in the repo.
        run: node scripts/check-canonical-urls.js
      - name: Full test suite
        run: npm test
      - name: Build & verify example labs
        run: node examples/build-examples.js
      - name: Every lab model exists in the catalogue
        run: node scripts/missing-devices.js examples --no-issues

  smoke:
    name: Server smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    # A device spec cannot change how the server boots or how the image builds. For a
    # data-only diff this job reports success without taking a runner for ten minutes.
    if: needs.changes.outputs.data_only != 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Drive the API end to end
        run: node scripts/smoke-http.js

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    # A device spec cannot change how the server boots or how the image builds. For a
    # data-only diff this job reports success without taking a runner for ten minutes.
    if: needs.changes.outputs.data_only != 'true'
    steps:
      - uses: actions/checkout@v4
      # node:20-bookworm ships no docker binary. The runner mounts the host
      # /var/run/docker.sock into the job (config `docker_host: automount`), so
      # installing the CLI is enough to build against the host daemon. The Dockerfile is
      # still checked statically first (fast, catches everything a build would catch
      # early), and the fallback below keeps the job honest on runners that provide
      # neither a binary nor a socket.
      - name: Dockerfile static checks
        run: node scripts/check-dockerfile.js
      - name: Install Docker CLI
        run: apt-get update && apt-get install -y docker.io
      - name: Build image (only where a docker daemon is available)
        run: |
          if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
            echo "docker daemon found - building the image for real"
            docker build -t packetforge:ci .
          else
            echo "No docker daemon in this job image (no docker binary, no docker socket)."
            echo "The Dockerfile passed the static checks above."
            echo "The image build is verified on runners that provide a daemon."
          fi
