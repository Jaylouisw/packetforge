name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Merging through the API does not reach the runner as a push event, so `main`
  # is the branch nothing verifies. This makes that a choice rather than a gap:
  # the same matrix can be run against any branch on demand.
  workflow_dispatch:

permissions:
  contents: read

# A pull request that gets rebased or amended starts a new run, but the run it
# superseded stays in the queue and is still executed. On this host there is a
# single runner, so those dead runs are not free: they are the difference between
# the queue draining in hours and in days, and they report on a commit nobody
# will merge. Cancel the superseded run instead of paying for it.
#
# Pushes to main are never cancelled - each one describes a different commit and
# a cancelled push run is a gap in the history of the default branch.
#
# Group by pull request, not by branch. Two runs of the same PR are the same
# question asked twice - the newer wins, so the older is cancelled. Two runs on
# `main` are different questions: each one verifies a different commit, and a
# cancelled one is a commit nobody ever tested.
#
# `github.event.pull_request.number || github.sha` does both. It previously fell
# back to `github.ref`, which is `refs/heads/main` for every push - so every
# post-merge verification shared one group, and as soon as merges got quick they
# started cancelling each other. Measured on 2026-11-08 after the runner's
# capacity was doubled: runs 672, 674 and 675 are three consecutive pushes to
# main, all cancelled before starting, inside two minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # There is no `Classify the change` job any more. Every answer it published is now
  # asked by the job that spends it, and the job itself had stopped being read.
  #
  # `data_only` and `code`: `docker` classifies its own diff with the same script and the
  # same arguments (it already had the tree, and one shallow fetch of the base commit is
  # ~1 s in a job that pays a checkout anyway), and it stands its own steps down on
  # `data_only=true`. The test legs never read either output - "three versions, always" is
  # written on the matrix itself. `live`: the legs and `docker` each ask it in their first
  # step, and `arm` now asks it before it reads the statuses; that was the only consumer
  # left.
  #
  # What was left by 2026-11-21 was therefore a job whose sole product was one API call,
  # and it cost a runner slot on every run. This runner takes four jobs at once and the
  # workflow asked for five (classify, docker, three legs), so the fifth - always a test
  # leg, the wall clock of the run - waited for the classifier to finish. Measured through
  # the leg logs over nine consecutive runs (pull requests 9258, 9254, 9238, 9235, 9214;
  # pushes 9250, 9246, 9230, 9225): the third leg started a median 9.9 s after the first
  # job, and the last leg ended a median 67.9 s in against a ~52 s suite - a median 74.5 s
  # of run for work whose floor is the suite plus one arm step.
  #
  # Nothing is skipped by this. The classification rule, the script, the base fetch and the
  # failure direction (anything unreadable is a code change, so the full matrix runs) are
  # the ones `docker` already used; the liveness rule and its failure direction (only a
  # positive `merged:true` / `state:closed` stands a job down) are the ones the legs
  # already used. A pull request still gets three Node versions, the smoke test, the image
  # build and the arm gate.

  # Ordered before `test` on purpose: the runner behind this repository takes four
  # jobs at once, and jobs are dispatched in the order they appear here. With `test`
  # first, its three legs filled three of those slots for their whole life and this job -
  # which needed only `changes` - sat behind them. Measured on run 9063 (push to main,
  # task 23856): the legs started 06:11:28 and this job was not received until
  # 06:12:28, only as the last slot freed, then held the tail for 18 s more before
  # `arm` could start at 06:12:50.
  # No step, check or condition changes here; only which job gets a slot first, so
  # the image build now runs beside the suite instead of after it.
  docker:
    name: Server smoke and Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # No dependency on a classifier job: this job is the classifier for the diff it is
    # about to build. It used to be created only after `Classify the change`
    # had finished, and on a four-slot runner whose three test legs hold three of those
    # slots for ~60 s, that edge was the reason this job kept losing the fourth one to
    # whatever else the host was running (a merge's `close`/`audit` pass, a `pr-rebase`,
    # another pull request's leg). Measured over the 33 pull-request runs 8952-9164
    # (/actions/tasks): this job was *created* 31-70 s after the legs (median +45 s), and
    # in 15 of those 33 runs it finished after every leg had reported - median +2 s, worst
    # +20 s (run 8976), which is merge latency and nothing else, because `arm` waits for
    # this job. Run 9164 is the shape of it: legs 08:25:27-08:26:30, this job created
    # 08:26:12 and done 08:26:35.
    #
    # Both answers the edge carried are now asked inside the first step of this job, which
    # already checks the commit out: the liveness call the classifier's `live` output came
    # from, and the `scripts/classify-change.js` run its `data_only` output came from. The
    # job therefore claims its slot at the same second the legs do instead of after
    # another job has taken it, and the two questions cost one shallow fetch of the base
    # commit (~1 s) in a job that already pays a checkout.
    #
    # A device spec cannot change how the server boots or how the image builds. For a
    # data-only diff this job still reports success without building anything - the `skip`
    # and `data_only` outputs below stand its steps down, with the same rule and the same
    # script the classifier used, not a cheaper one.
    #
    # `always()` for the reason the test jobs below measure: a step that dies must run the
    # gate, not skip it. An absent or unreadable answer therefore means "run", and the only
    # value that stands the steps down is the `true` written after reading a diff this job
    # could actually see. Reproduced in run 6201, where a deliberately failing classify job
    # had both of these jobs report `skipped`; run 6076 is the same failure in the wild.
    if: always()
    steps:
      # Same git checkout as the `changes` job - see the measured note there: 4.7-10.2 s of
      # every job in this workflow was the checkout action's clone, and the three test legs
      # clone that action into one shared directory within seconds of each other.
      - name: Check out this commit, from git
        id: gate
        env:
          TOKEN: ${{ secrets.FORGEJO_TOKEN || secrets.GITHUB_TOKEN || github.token }}
        run: |
          set -eu
          # The two questions this job used to wait for another job to answer. They are
          # asked here because this step already has the tree: the liveness call stands a
          # merged or closed pull request down, and `classify-change.js` is the same script
          # with the same arguments the classifier job runs, so `data_only` means exactly
          # what it meant there. Every failure path below answers "run".
          echo "skip=false" >> "${GITHUB_OUTPUT:-/dev/null}"
          echo "data_only=false" >> "${GITHUB_OUTPUT:-/dev/null}"
          # The runner's working directory is the repository root. Derive the git URL from
          # the instance URL the runner itself is configured with, never a hardcoded host.
          server="${GITHUB_SERVER_URL:-}"
          if [ -z "$server" ]; then
            api="${GITHUB_API_URL:-http://10.0.10.20:3000/api/v1}"
            server="${api%/api/v1}"
          fi
          url="${server}/${GITHUB_REPOSITORY}.git"
          sha="${{ github.sha }}"
          git init -q .
          git remote add origin "$url"
          # One commit, three attempts. The fetch is the only step in this job that talks to a
          # network, and the network answers this runner with aborts that say nothing about
          # the commit: task 13960 (run 5540, Test (Node 22), push 52cff888) died 34 s in
          # with `Operation too slow. Less than 1000 bytes/sec transferred the last 30
          # seconds` while its Node 18 and Node 20 siblings ran the same commit green in
          # 54 s and 53 s, and the smoke and Docker jobs of that run went on to pass - a
          # red X on a tree with nothing wrong with it, and a pull request that cannot
          # merge until somebody re-runs it by hand. That is the one failure a retry is
          # honest for: a second attempt asks the same server for the same commit, and if
          # every attempt fails the job still fails, with the same status and the same
          # message. Nothing is hidden - a commit that does not exist, a token that is not
          # accepted and a repository that is gone all fail every attempt.
          # Three, not more: 3 x 90 s plus 10 s of backoff is a 280 s ceiling, which is
          # below the 300 s a single attempt used to get, so a dead server costs this job
          # less than it did before while a blip no longer costs a whole run. 90 s is also
          # 25x the 3.5 s checkout measured here (run 5719, task 14549), so a slow but
          # working server still passes.
          attempt=1
          rc=1
          while [ "$attempt" -le 3 ]; do
            if [ -n "${TOKEN:-}" ]; then
              timeout 90 git -c "http.extraheader=Authorization: token ${TOKEN}" -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=30 fetch -q --depth=1 origin "$sha" && rc=0 || rc=$?
            else
              timeout 90 git -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=30 fetch -q --depth=1 origin "$sha" && rc=0 || rc=$?
            fi
            if [ "$rc" -eq 0 ]; then
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "fetch of ${sha} failed on attempt ${attempt} of 3 (rc ${rc}) - retrying in 5 s; a transport abort is not a verdict about the commit"
              sleep 5
              attempt=$((attempt + 1))
            else
              break
            fi
          done
          if [ "$rc" -ne 0 ]; then
            echo "::error title=Checkout::${sha} could not be fetched after ${attempt} attempt(s) (rc ${rc}) - no tree means nothing in this job could be tested, so it fails rather than passing on an empty directory"
            exit "$rc"
          fi
          git checkout -q -f --detach FETCH_HEAD
          # The action emptied the directory before it checked out; this is the same
          # guarantee, applied to whatever the runner left in the workspace: after this
          # line the tree is the commit's own files and nothing else.
          git clean -qfdx
          echo "checked out $(git rev-parse HEAD) of ${url} with git - no action cache involved"
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            exit 0
          fi
          api="${GITHUB_API_URL:-http://10.0.10.20:3000/api/v1}"
          number="${{ github.event.pull_request.number }}"
          json=$(curl -sS --connect-timeout 5 --max-time 20 --retry 2 --retry-delay 1 \
                   --retry-connrefused -H "Authorization: token ${TOKEN:-}" \
                   "$api/repos/$GITHUB_REPOSITORY/pulls/$number" 2>/dev/null || true)
          if printf '%s' "${json:-}" | grep -q '"merged":true'; then
            echo "skip=true" >> "${GITHUB_OUTPUT:-/dev/null}"
            echo "pull #${number} is already merged - this job cannot gate anything, so its steps stand down"
            exit 0
          fi
          if printf '%s' "${json:-}" | grep -q '"state":"closed"'; then
            echo "skip=true" >> "${GITHUB_OUTPUT:-/dev/null}"
            echo "pull #${number} is closed - this job cannot gate anything, so its steps stand down"
            exit 0
          fi
          if [ -z "${json:-}" ]; then
            echo "could not ask whether pull #${number} is still open - no reply from ${api} - building anyway"
          else
            echo "pull #${number} is open - building unless the diff is data-only"
          fi
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "${base:-}" ]; then
            echo "no base sha - treating this as a code change and building"
            exit 0
          fi
          if ! timeout 60 git -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=30 fetch -q --depth=1 origin "$base"; then
            echo "the base commit ${base} could not be fetched - treating this as a code change and building"
            exit 0
          fi
          out="${RUNNER_TEMP:-/tmp}/docker-classify.out"
          : > "$out"
          if GITHUB_OUTPUT="$out" timeout --signal=TERM --kill-after=10 120 node scripts/classify-change.js --base "$base" --head HEAD; then
            data_only=$(sed -n 's/^data_only=//p' "$out" | tail -1)
          else
            data_only=""
            echo "the diff could not be classified within 120 s - treating this as a code change and building"
          fi
          case "${data_only:-}" in
            true) echo "data_only=true" >> "${GITHUB_OUTPUT:-/dev/null}"
                  echo "this diff is data-only - the smoke test and the image build cannot be changed by it" ;;
            *)    echo "data_only=false" >> "${GITHUB_OUTPUT:-/dev/null}" ;;
          esac
      # No setup-node here: this job already runs on Node 20, and downloading Node 20
      # onto Node 20 was most of a 48 s job. Measured through the actions API on
      # 2026-11-16 over the 22 successful smoke jobs between 06:37 and 08:17 (tasks
      # 7312-7608): median 48.5 s, range 39-63 s, against a median 22 s for the `docker`
      # job that does strictly more work and downloads no runtime. The `Test (Node *)`
      # legs already dropped the same step (run 3122, task 6833: the setup-node clone and
      # tarball were 25 s of a 229 s leg) and still assert their runtime in-job.
      #
      # The runtime that matters here is "the one the smoke script was written against",
      # and the three-leg matrix is what holds that line - it runs the suite on 18, 20 and
      # 22. This job's job is the HTTP surface, so the version is printed rather than
      # asserted: an image bump that changes the runtime should be visible in the log, not
      # a red check on a pull request that never touched the server.
      - name: Which runtime is running this
        if: steps.gate.outputs.skip != 'true' && steps.gate.outputs.data_only != 'true'
        run: node --version && npm --version
      # The smoke client is the one thing here that can wait forever: `req()` settles on the
      # response's `end` or on `error`, and a connection accepted and then never answered is
      # neither - the promise never settles and Node exits only when something outside it
      # kills the process (tasks 11669, 11193, 10082: 676 s, 872 s and 792 s of a two-slot
      # runner, each leaving no log at all). So it keeps the 180 s bound it had as a step of
      # its own, and it keeps its log, because Node is signalled and the exit status is
      # recorded instead of the step being killed from outside.
      #
      # It runs here, detached, so the ~10 s the HTTP surface costs runs over the image build
      # below instead of in front of it. The status goes to a file because the process is not
      # this step's child: `nohup` keeps it alive across the step boundary (the Node download
      # in the test legs relies on the same thing), and the last step of this job waits for
      # that file and reports it with the same `::error title=Server smoke test` title.
      - name: Drive the API end to end, beside the image build
        if: steps.gate.outputs.skip != 'true' && steps.gate.outputs.data_only != 'true'
        run: |
          set -eu
          dir="${RUNNER_TEMP:-/tmp}"
          rm -f "$dir/smoke-http.rc" "$dir/smoke-http.pid"
          mkdir -p "$dir"
          echo "starting node scripts/smoke-http.js here, so the image build below runs over it"
          nohup sh -c 'timeout --signal=TERM --kill-after=15 180 node scripts/smoke-http.js > "$1/smoke-http.log" 2>&1; echo $? > "$1/smoke-http.rc"' sh "$dir" > "$dir/smoke-http.nohup" 2>&1 &
          echo $! > "$dir/smoke-http.pid"
      - name: Dockerfile static checks
        if: steps.gate.outputs.skip != 'true' && steps.gate.outputs.data_only != 'true'
        run: timeout --signal=TERM --kill-after=10 60 node scripts/check-dockerfile.js
      - name: Install Docker CLI
        if: steps.gate.outputs.skip != 'true' && steps.gate.outputs.data_only != 'true'
        # This step needs one binary that can talk to the host's socket, and
        # `apt-get install docker.io` was buying a container runtime to get it:
        # 78.4 MB across ~40 packages, including systemd, apparmor, dbus and
        # runc that are never used (measured in run 2794, task 6148: apt
        # 20:16:02-20:16:28, 26 of the job's 53 seconds). The static tarball is
        # the same client with no runtime attached, a tenth of the unpacking,
        # and no dependency on a distro mirror that can stall inside the job's
        # 10-minute budget.
        #
        # Pinned rather than floating: a CI gate that changes what it downloads
        # from the internet between runs is not a gate. If the download is
        # unavailable the plain package is installed exactly as before, so a
        # blocked mirror costs the old 26 seconds rather than the build check;
        # if neither path yields a binary the step fails loudly instead of
        # letting the build fall back to "no daemon" and claim a pass.
        env:
          DOCKER_CLI_VERSION: 24.0.7
        run: |
          if command -v docker >/dev/null 2>&1; then
            echo "docker CLI already present: $(docker --version 2>/dev/null || echo 'unknown version')"
            exit 0
          fi
          # A CLI is only worth downloading if there is a daemon for it to talk to.
          # When no socket is mounted the build step below takes its documented
          # "no daemon in this job" path on purpose - it is not a failure - and
          # buying a client to discover that costs a download that can itself fail.
          # On 2026-11-20 the runner lost egress for 7.5 h; every docker job in that
          # window died here (task 22378, run 8465, 10:11:37Z: "curl: (7) Failed to
          # connect to download.docker.com") instead of taking the path it already
          # has for a job with nothing to build against. A socket is the one thing
          # that decides whether a build was possible at all.
          if [ -z "${DOCKER_HOST:-}" ] && [ ! -S /var/run/docker.sock ]; then
            echo "::warning title=Docker CLI::no docker socket in this job and no docker CLI - the image cannot be built here, so only the Dockerfile checks above gate this run"
            echo "no daemon, nothing to build: the static Dockerfile checks are this job's gate on a runner without a socket"
            exit 0
          fi
          curl -fsSL --retry 2 --retry-delay 2 --max-time 60             -o /tmp/docker-cli.tgz             "https://download.docker.com/linux/static/stable/x86_64/docker-${DOCKER_CLI_VERSION}.tgz"             && tar -xzf /tmp/docker-cli.tgz -C /usr/local/bin --strip-components=1 docker/docker             && echo "static docker CLI unpacked into /usr/local/bin" || true
          if ! command -v docker >/dev/null 2>&1; then
            echo "static download unavailable - falling back to the distro package"
            export DEBIAN_FRONTEND=noninteractive
            # Bounded like everything else here: a distro mirror that answers slowly is
            # a 90 s problem, not an hour-long one. `apt-get install` was the one command
            # in this job that could wait on a mirror indefinitely.
            # `|| echo` rather than a bare call: this file runs under `bash -e`, and
            # `apt-get update` exits 100 the moment a mirror is unreachable - which is
            # exactly the case this fallback exists for. The step then died on the
            # update, never reached the install below it, and reported a bare
            # `exitcode 100` with no `::error` title: five docker jobs on 2026-11-20
            # (task 22378 run 8465 10:11:37Z, task 22387 run 8469 10:12:21Z, and three
            # more) all ended that way while the Dockerfile checks and the HTTP smoke
            # test had passed. The install is attempted from whatever lists the image
            # already carries; if that fails, the guard under it still fails the step.
            timeout --signal=TERM --kill-after=10 90 apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 update -qq             || echo "package lists could not be refreshed - trying the install from the lists this image already has"
            timeout --signal=TERM --kill-after=15 240 apt-get install -y -qq docker.io             || echo "the distro package could not be installed either"
          fi
          command -v docker || { echo "::error title=Docker CLI::no docker binary and no fallback package - the image build below would be skipped silently (download.docker.com and the distro mirror were both unreachable)"; exit 1; }
          docker --version
      - name: What the host's disk looks like before this job
        if: steps.gate.outputs.skip != 'true' && steps.gate.outputs.data_only != 'true'
        # Printed before the build as well as after it, so a growing volume reads as a trend in the
        # log rather than as a single number someone has to remember.
        # `docker system df` talks to the host daemon over the mounted socket, so an
        # unresponsive daemon used to hang this step before the build had even started.
        run: |
          timeout --signal=TERM --kill-after=5 30 df -h / || true
          timeout --signal=TERM --kill-after=5 30 docker system df 2>/dev/null || true
      - name: Build image (only where a docker daemon is available)
        if: steps.gate.outputs.skip != 'true' && steps.gate.outputs.data_only != 'true'
        run: |
          # Actions runs this file as `bash -e`, so without this the first non-zero
          # exit ends the step at that line - before `rc` is read and before the
          # timeout is named. The exit status is still carried out of the step below.
          set +e
          if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
            echo "docker daemon found - building the image for real"
            # 180 s against 10-20 s of green build inside a 76 s worst green job, and
            # against the 606-3,297 s the failed ones took. `--kill-after` because a
            # build blocked on the daemon can outlive SIGTERM.
            # Tagged with this commit, not with a name every build on the host shares.
            #
            # `docker build -t packetforge:ci` gave every job on this daemon one tag, and
            # the cleanup step below removes that tag - which removes the *image*, because
            # the tag is its only reference. Two builds overlapping is the normal case on
            # this host (a merge on main fires the rebase pass, every rebased pull request
            # starts a matrix, and they all share one daemon): the build that finishes
            # first deletes the image the other one is using as a cache parent, and the
            # other one dies exporting its last layer.
            #
            # Four of the five failed `Docker build` tasks in the 72 hours to
            # 2026-11-19T20:27Z are exactly that, and the timing names the culprit: each
            # died 14-19 s in, and in every one another `Docker build` on this daemon
            # finished 13-16 s into it - the second its cleanup ran:
            #   run 7887 task 20834, 20:11:18Z, failed 14 s in; run 7883 finished 20:11:31
            #   run 7762 task 20470, 17:10:54Z, failed 15 s in; run 7758 finished 17:11:10
            #   run 7378 task 19408, 09:44:57Z, failed 14 s in; run 7374 finished 09:45:10
            #   run 7330 task 19273, 08:45:26Z, failed 19 s in; run 7326 finished 08:45:42
            # #2193 removed an `image prune --filter until=24h` for the same signature
            # (`failed to export image: ... unknown parent image ID`) and the failures kept
            # coming back after it, because this removal was the other half. `arm` has
            # `needs: docker`, so each one blocked a green pull request's merge.
            #
            # `packetforge:ci-<sha>` can only be held by this commit's own builds, and the
            # cleanup below removes exactly the tag this run created. Nothing consumes the
            # image - it exists to prove the Dockerfile builds - so the name is free.
            #
            # The tag fixed the *shared-tag* half of that, and not the rest of it. Measured
            # after #2193 and after the unique tag: run 8834 (task 23298, push to main,
            # 2026-11-21T01:12:53Z) and run 8287 (task 21914, push to main,
            # 2026-11-20T05:12:58Z) both died 5 s in with
            #   failed to export image: failed to set parent sha256:572e12ed7a9a...:
            #   unknown parent image ID sha256:572e12ed7a9a...
            # on commits whose three test legs were green, and `arm` needs this job, so
            # each of those held a merge until somebody re-ran it by hand. Both times two
            # or three builds shared the daemon: 8834 started 01:12:37 beside 8830
            # (01:12:31); 8287 started 05:12:44 beside 8285 (05:12:40) and 8281 (05:12:34).
            # The prune guard was not the deleter this time - 8830's log at 01:12:49.5
            # reads "not pruning this time: 2 Docker build(s) are running". The legacy
            # builder's cache is content addressed and shared, so two builds of the same
            # early layers race for the same intermediate and the one that loses cannot
            # export it.
            #
            # So: one retry, and only for that signature. A Dockerfile that is really
            # broken prints a Dockerfile error and is not retried at all; a build that hit
            # the shared-cache race rebuilds from whatever cache entry is left, ~10 s.
            # Both attempts are printed in full and the reason is an annotation, so the
            # retry is never silent. Same command, same tag, same 180 s bound per attempt
            # (363 s worst case, inside this job's 10 minutes).
            log="${RUNNER_TEMP:-/tmp}/docker-build.log"
            : > "$log"
            build_once() {
              timeout --signal=TERM --kill-after=20 180 docker build -t packetforge:ci-run-${{ github.run_id }} . 2>&1 | tee "$log"
              return "${PIPESTATUS[0]}"
            }
            build_once
            rc=$?
            if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
              echo "::error title=Docker build::docker build was still running after 180 s and was stopped - a green build here takes 10-20 s, so this is a build that stopped moving, not a slow one"
            fi
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ] && [ "$rc" -ne 137 ] &&
               grep -qE 'unknown parent image ID|failed to export image' "$log"; then
              echo "::warning title=Docker build::attempt 1 died exporting against the shared build cache (unknown parent image ID) - that is the race two concurrent builds on this daemon produce, not a verdict about the Dockerfile; rebuilding once"
              sleep 3
              build_once
              rc=$?
              if [ "$rc" -ne 0 ]; then
                echo "::error title=Docker build::the retry after the shared-cache export race also failed (exit ${rc}) - this is a real build failure, not the race"
              fi
            fi
            exit "$rc"
          else
            echo "No docker daemon in this job image (no docker binary, no docker socket)."
            echo "The Dockerfile passed the static checks above."
            echo "The image build is verified on runners that provide a daemon."
          fi
      # This build runs against the HOST daemon through the mounted socket, so its layers, its
      # intermediate images and its build cache live on the same volume as Forgejo's own data.
      # Nothing consumes `packetforge:ci` - it exists to prove the Dockerfile builds - and nothing
      # removed it, so every code push left a little more behind, forever.
      #
      # `if: always()` because the failure case is the expensive one: a build that dies half way
      # through leaves the most behind, and that is exactly when a cleanup step written without it
      # would be skipped. `--keep-storage` bounds the cache instead of dropping it, so the next
      # build still gets a warm start; docker 20.10 has no `--keep-storage`, hence the fallback.
      - name: Bound what the build left behind
        # `if: always()`, not `if: always() && ...`: the disk-hygiene check in this tree
        # requires that exact condition on the step that prunes, because a build that
        # failed is the one that leaves the most behind. The two answers this job answers
        # for itself are read inside the step instead, and both of them mean "nothing was
        # built, so nothing was written" - which is a different thing from "skip the
        # cleanup of a build that ran".
        if: always()
        env:
          TOKEN: ${{ secrets.FORGEJO_TOKEN || secrets.GITHUB_TOKEN || github.token }}
          GATE_SKIP: ${{ steps.gate.outputs.skip }}
          GATE_DATA_ONLY: ${{ steps.gate.outputs.data_only }}
        run: |
          if [ "${GATE_SKIP:-}" = "true" ] || [ "${GATE_DATA_ONLY:-}" = "true" ]; then
            echo "this job built nothing (skip=${GATE_SKIP:-false} data_only=${GATE_DATA_ONLY:-false}) - nothing was written to the host, so there is nothing to reclaim"
            exit 0
          fi
          if ! command -v docker >/dev/null 2>&1 || ! docker info >/dev/null 2>&1; then
            echo "No docker daemon here - nothing was written to the host, so nothing to reclaim."
            exit 0
          fi
          api="${GITHUB_API_URL:-http://10.0.10.20:3000/api/v1}"
          api_tasks="$api/repos/$GITHUB_REPOSITORY/actions/tasks?status=running&limit=50"
          # Each of these talks to the host daemon, which is the thing that can be
          # unresponsive in the first place: cleanup that hangs is worse than no
          # cleanup, because it holds the slot the next job is queued for. Still
          # best-effort, now bounded.
          # The image this run created, by the tag only this commit can hold.
          timeout --signal=TERM --kill-after=10 60 docker image rm -f packetforge:ci-run-${{ github.run_id }} >/dev/null 2>&1 || true
          # `docker image prune -f --filter "until=24h"` used to run here, and it reddened
          # `main` twice on 2026-11-19. It deletes old *dangling* images - which is what the
          # legacy builder's cache names as parents: `WORKDIR /app` has not changed in
          # weeks, so the intermediate behind it is older than a day while the cache entry
          # saying `---> Using cache` is not. The prune removed the image and left the
          # entry, and the next build died at the first step it could not reuse:
          #   run 7378 (task 19408, push to main, 09:44:57Z) `Failing after 14s`
          #   run 7762 (task 20470, push to main, 17:10:54Z) `Failing after 15s`
          #   Step 2/8 : WORKDIR /app ---> Using cache
          #   Step 3/8 : COPY . .
          #   failed to export image: failed to set parent sha256:39e26cbad...
          #   unknown parent image ID sha256:39e26cbad...
          # On main those two commits were otherwise green (nine other checks green), so a
          # build that was fine read as a red gate - and `arm` needs `docker`, so it blocked
          # the merge behind a cache left over from an unrelated earlier push.
          # Nothing this job writes needs that line: the image it creates is removed by name
          # above, and the layers behind it are the builder's own bookkeeping, which the
          # builder prune below bounds by size - the 2 GB bound is unchanged. So the
          # line goes, and the disk rule is unchanged with it: same `if: always()`, same image
          # removal by name, same `--keep-storage 2GB`, same `docker system df` after it
          # (scripts/check-ci-disk-hygiene.js, test/ci-disk-hygiene.test.js).
          # Both of the calls below are about the *shared* cache, not about this run's
          # image, so they wait until no other `Docker build` is in flight.
          #
          # `--keep-storage 2GB` drops least-recently-used intermediates, and an
          # intermediate that another job started building against a second ago is not
          # least-recently-used - it is in use, and the legacy builder does not know that.
          # The result is the same `failed to export image: ... unknown parent image ID`
          # the build step above documents. One bounded call to the actions API answers
          # "how many builds are running right now"; a run with nothing else to do pays
          # ~0.2 s for it and keeps the 2 GB bound. When the answer cannot be read the
          # prune runs anyway - an unreadable API must not become an unbounded cache - and
          # says so.
          busy=unknown
          if [ -n "${TOKEN:-}" ]; then
            body=$(curl -sS --connect-timeout 5 --max-time 15 --retry 2 --retry-delay 1 \
                     --retry-connrefused -H "Authorization: token ${TOKEN}" \
                     "$api_tasks" 2>/dev/null) || body=""
            if [ -n "$body" ]; then
              busy=$(printf '%s' "$body" | node -e '
                let d = "";
                process.stdin.on("data", (c) => { d += c; });
                process.stdin.on("end", () => {
                  let j; try { j = JSON.parse(d); } catch (e) { console.log("unknown"); return; }
                  // The cleanup runs inside the running Docker build task itself, so a
                  // count of one means the daemon is this job and nothing else. No run
                  // identity has to be resolved here - one less expression that can come
                  // back empty and quietly switch the disk bound off.
                  //
                  // The name is matched by suffix, not by equality. #2219 put the smoke
                  // test in this job, so it is called `Server smoke and Docker build`
                  // now; the `=== "Docker build"` this replaces matched no task at all
                  // afterwards - this job included - so the count was 0 on every run and
                  // this case reads 0 as "alone". Measured 2026-11-20T00:30Z: none of the
                  // 19 `Server smoke and Docker build` tasks can match that equality, and
                  // 37 of the 144 docker tasks in the 15 h to then shared the daemon with
                  // another build, so the 2 GB prune ran under a live build in exactly
                  // the runs the guard was written for - the race that failed runs 7378,
                  // 7762, 7883 and 7887 with `unknown parent image ID`. Both names end in
                  // `Docker build`, and so does the ci.yml that older pull requests still
                  // run, so a suffix match counts this job whichever name it carries.
                  const builds = (j.workflow_runs || []).filter((t) => /Docker build$/.test(t.name || ""));
                  // An empty list is the unreadable case, not the alone case: the task
                  // for this job is in that list whenever the API answered at all, so
                  // "no Docker build running" cannot be true.
                  if (!builds.length) { console.log("unknown"); return; }
                  console.log(builds.length);
                });
              ' 2>/dev/null || echo unknown)
            fi
          fi
          case "$busy" in
            0|1)
              # The fixed tag every build used before this change; nothing creates it any
              # more, so it is removed only here, where no in-flight build can be using it.
              timeout --signal=TERM --kill-after=10 60 docker image rm -f packetforge:ci >/dev/null 2>&1 || true
              timeout --signal=TERM --kill-after=15 120 docker builder prune -f --keep-storage 2GB >/dev/null 2>&1 \
                || timeout --signal=TERM --kill-after=15 120 docker builder prune -f >/dev/null 2>&1 \
                || true ;;
            *)
              echo "not pruning this time: ${busy} Docker build(s) are running on this daemon, this one included - the cache the others are building against is not this job's to drop"
              ;;
          esac
          echo "--- what this job left on the host ---"
          docker system df || true
          df -h / || true
      # The smoke verdict, printed at the end of the job instead of 11 s in - the same move the
      # test legs made for their static checks (#2122). Nothing is weakened: the same script,
      # the same 180 s bound, the same `::error title=Server smoke test`, and a non-zero exit
      # still reddens the job. This step is `if: always()` for the same reason the cleanup is:
      # a build that dies is exactly when the smoke result is most worth reading - and a
      # failed build step must not swallow the smoke step's verdict.
      - name: Report the server smoke test
        if: always() && steps.gate.outputs.skip != 'true' && steps.gate.outputs.data_only != 'true'
        run: |
          set +e
          dir="${RUNNER_TEMP:-/tmp}"
          rcf="$dir/smoke-http.rc"
          if [ ! -s "$rcf" ] && [ ! -s "$dir/smoke-http.pid" ]; then
            echo "::error title=Server smoke test::the smoke test was never started - the step that launches it did not get that far, so the HTTP surface was not driven"
            exit 1
          fi
          # Bounded here too: the script has its own 180 s `timeout`, and this waits 200 s for
          # the status file, so a client that ignores SIGTERM cannot hold the slot past that.
          for _ in $(seq 1 200); do
            if [ -s "$rcf" ]; then break; fi
            sleep 1
          done
          echo "--- node scripts/smoke-http.js ---"
          cat "$dir/smoke-http.log" 2>/dev/null || true
          if [ ! -s "$rcf" ]; then
            echo "::error title=Server smoke test::scripts/smoke-http.js had not exited after 200 s - a green run takes ~11 s here, so this is a request that never answered"
            exit 1
          fi
          rc=$(tr -d '[:space:]' < "$rcf")
          [ -n "$rc" ] || rc=1
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
            echo "::error title=Server smoke test::scripts/smoke-http.js was still running after 180 s and was stopped - a green job takes ~11 s here and the slowest green job in the last 24 h took 30 s, so this is a request that never answered, not a slow server"
            exit 1
          fi
          if [ "$rc" -ne 0 ]; then
            echo "::error title=Server smoke test::scripts/smoke-http.js exited ${rc}"
            exit 1
          fi
          echo "HTTP smoke passed (all checks clean)"

  # The one place that knows the checks are green, because it runs after them.
  #
  # Every merge gate in this repository used to be an arm, and an arm is not a gate.
  # pr-rebase.yml and auto-rebase.yml both POST
  # `{"Do":"squash","merge_when_checks_succeed":true}` immediately after the force-push
  # that rebased the branch, and Forgejo evaluates that flag against the checks that
  # exist at the moment of the call. For a head pushed seconds earlier that set is
  # empty - and "all checks succeeded" over nothing is true - so the pull request
  # merged and CI then reported on a commit that was already on `main`.
  #
  # Measured on 2026-11-16 through `/commits/{sha}/status` over the 25 most recently
  # merged pull requests (#1723, #1722, #1721, #1719, #1718, #1717, #1716, #1715,
  # #1713, #1712, #1711, #1710, #1709, #1708, #1707, #1706, #1705, #1704, #1703,
  # #1702, #1700, #1699, #1698, #1690): all 25 merged before any of their seven checks
  # reported, and 15 of them had no status at all on the head commit at the moment of
  # the merge. #1719 is the clearest single case: its rebase job (run 4092) armed it at
  # 19:59:43 with HTTP 201, Forgejo merged it at 19:59:54, and its own CI run (4091) did
  # not finish its first test leg until 20:00:46 - 52 s after the commit it was testing
  # was already on `main`. A red pull request could not have been stopped by that path,
  # because the path never saw the checks.
  #
  # So the merge moves to the one job that has the answer. `needs` supplies the
  # results, and the statuses API is asked as well, because a leg skipped for a
  # data-only diff is a legitimate `skipped` while a leg that never reported is not.
  # The three CI test legs are required by name: a status set that has not yet grown
  # them is a run that has not started, not a run that passed.
  #
  # Nothing here can turn a red pull request green, and nothing here can go red on a
  # pull request that is fine: every failure is a `::warning::` and an unmerged but
  # untouched branch. The merge carries `head_commit_id`, so a run against a commit
  # that has since been rebased away is refused by the server rather than merging a
  # tree this run never tested.
  # A job that hangs holds the only runner, and a held runner is a queue that
  # stops moving: issue #930 documents a task stuck in `running` for over forty
  # minutes while every other pull request waited behind it. A bound does not make
  # the job faster, it makes the failure cost ten minutes instead of an afternoon.
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    # 15 -> 10 minutes. `timeout-minutes` is a hard kill by the runner, and a hard kill
    # takes the job's log with it, so what this number buys is the cost of an unexplained
    # red rather than a safety margin: task 14236 (run 5616, Test (Node 20), pull request,
    # 2026-11-17T21:47:39Z) was killed at exactly 900 s and its log is the string
    # `dbfs open "actions_log/.../14236.log.zst": file does not exist`, while its Node 18
    # and Node 22 siblings finished the same commit in 51 s and 45 s. 10 min is still
    # more than eight times the slowest green leg measured over the last 120 (69 s), and
    # above the two inner bounds that can legitimately run long (a 300 s checkout fetch, a
    # 300 s suite plus its shutdown), so a working leg is never cut - a hung one costs two
    # thirds of what it did. The steps below that had no bound of their own now have one;
    # see the note above the static checks.
    timeout-minutes: 10
    # No `needs: changes`. This job used to wait for `Classify the change`, and that wait
    # was the largest fixed cost left in front of every leg - even though nothing in the
    # classifier can change what a leg does. The matrix reads none of its outputs:
    # `data_only` only stands `smoke` and `docker` down, and `live` is now asked by the leg
    # itself (see the first step below). Yet each leg could not even be created until the
    # classifier had finished.
    #
    # Measured through /api/v1/repos/jaylouisw/packetforge/actions/tasks over the 858
    # `Classify the change` tasks of the last two days: median 7 s, p90 11 s. On run 6947
    # (pull #2071, 2026-11-19) the classifier held 02:22:05-02:22:11 and `Test (Node 18)` -
    # the leg that is the wall clock of that run, 61 s of 75 s - was created at 02:22:13,
    # so eight seconds of the run were spent deciding a question no leg asks. Run 6945 is
    # the same at nine. The classifier is still worth its 7 s (it saves `smoke` and
    # `docker` a slot each on a data-only diff); it just does not need to be paid before
    # coverage starts.
    #
    # The same dependency is also why task 15604 (run 6076, pull #1957) reported one red X
    # and zero coverage: the classifier hung for 855 s and the five jobs below it were
    # never created. Without the edge the legs run and report on the commit whatever the
    # classifier does - the same conservative answer the classifier publishes when it
    # cannot read a diff.
    #
    # Stood down only for a pull request the API positively reports as merged or closed
    # (the `still open?` step below, which is the `changes` job's `liveness` call moved):
    # the job cannot change an outcome there, and on a shared runner it is the difference
    # between a live pull request waiting minutes or hours. Every open pull request still
    # gets all three Node versions.
    #
    # `always()`, which now has no dependency to be woken by and simply says "never let a
    # previous job's colour decide whether this one reports". A skipped test leg is not a
    # failure - it is a run that reports nothing at all. Measured: task
    # 15604 (run 6076, pull #1957, 2026-11-18T08:21:26Z) was the only task its run ever
    # created - the classify job failed after 855 s, no log survived (`dbfs open
    # "actions_log/jaylouisw/packetforge/f4/15604.log.zst": file does not exist`) and the
    # five jobs below it were never created, so that pull request carried one red X and
    # zero coverage of its diff. Reproduced deliberately: run 6201 (tasks 15979-15985,
    # branch probe-classify-fail, a 4-line probe that makes the classify job `exit 1`)
    # reported `skipped` on all three legs, on smoke, on Docker and on arm. With
    # `always()` the matrix runs instead, which is the same conservative answer the
    # classifier itself publishes whenever it cannot read a diff.
    #
    # Nothing is skipped by this. The stand-down only fires on a positive `merged: true`
    # or `state: closed` from the API, and an absent token, a timed-out API or an
    # unparseable body runs the leg exactly as before. A run that is cancelled still
    # cancels its jobs; `always()` describes a failed dependency, not a cancelled run.
    if: always()
    # A data-only diff used to run one Node version instead of three. That saving was bought with
    # an `if:` that read `matrix.node`, which cannot work: the job condition is evaluated before
    # the matrix exists, so every leg died ~2 s after starting (runs 1398, 1401, 1402 - three red
    # X's per pull request that looked like a broken runner). Building the matrix from an
    # expression instead is no better: act resolves it to a single unnamed leg, so the suite runs
    # once and silently reports coverage it never had.
    #
    # So: three versions, always. The data-only saving that survives is the one that is honest -
    # `smoke` and `docker` skip a JSON-only diff entirely, which is where the runner slots were
    # actually going (ten minutes each, versus ~60 s for the suite).
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      # The question the `changes` job used to answer for the whole matrix, asked by the
      # leg that is about to spend a slot. Same call, same rule, same direction of
      # failure: `closed=true` is written only for a pull request the server positively
      # reports as merged or closed, and every other outcome - no token, a timeout, a
      # reply that is not JSON, a push event - leaves the output unset and the steps below
      # run. The cost is one API call (~0.3 s) instead of the 7 s median of a job in front
      # of the matrix.
      #
      # It cannot make the job `skipped` the way the dependency could - a step cannot skip
      # the job it lives in - so a leg that stands down reports `success` with this line in
      # its log. That is the colour the `changes` job has always had while it stood the
      # other four down, and it cannot merge anything: the only thing being stood down for
      # is a pull request that is already merged or closed, and `arm` pins `head_commit_id`
      # against a server that refuses a closed pull request.
      # Same git checkout as the `changes` job - see the measured note there: 4.7-10.2 s of
      # every job in this workflow was the checkout action's clone, and the three test legs
      # clone that action into one shared directory within seconds of each other.
      #
      # This step also carries the liveness question that used to be the step above it:
      # one fewer step boundary before the suite, and the answer is unchanged - only a
      # positive `merged` or `closed` stands the leg down, every other outcome runs it.
      - name: Check out this commit, from git
        id: still_open
        env:
          TOKEN: ${{ secrets.FORGEJO_TOKEN || secrets.GITHUB_TOKEN || github.token }}
        run: |
          set -eu
          # The liveness question is asked here, in the step that was going to run anyway,
          # rather than in a step of its own. A step on this runner is a container exec, a
          # shell and its own log stream, and five of them are paid for before the suite
          # starts - this one asked a question that costs 0.3 s. Same call, same rule, same
          # direction of failure as before: only a positive "merged" or "closed" stands the
          # leg down, and every other answer runs it.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            api="${GITHUB_API_URL:-http://10.0.10.20:3000/api/v1}"
            number="${{ github.event.pull_request.number }}"
            json=$(curl -sS --connect-timeout 5 --max-time 20 --retry 2 --retry-delay 1 \
                     --retry-connrefused -H "Authorization: token ${TOKEN:-}" \
                     "$api/repos/$GITHUB_REPOSITORY/pulls/$number" 2>/dev/null || true)
            if printf '%s' "$json" | grep -q '"merged":true'; then
              echo "closed=true" >> "${GITHUB_OUTPUT:-/dev/null}"
              echo "pull #${number} is already merged - this leg cannot gate anything, so it stands down"
              exit 0
            fi
            if printf '%s' "$json" | grep -q '"state":"closed"'; then
              echo "closed=true" >> "${GITHUB_OUTPUT:-/dev/null}"
              echo "pull #${number} is closed - this leg cannot gate anything, so it stands down"
              exit 0
            fi
            if [ -z "$json" ]; then
              echo "could not ask whether pull #${number} is still open - no reply from ${api} - running the leg"
            else
              echo "pull #${number} is open - running the leg"
            fi
          fi
          # The pinned runtime this leg is named for is 45 MB from nodejs.org, and the
          # checkout below is 2.6 s of git: one is a network transfer, the other is a
          # packfile on local disk. They ran one after the other, so every Node 18 and
          # Node 22 leg paid for both, end to end, in front of the suite. Measured over the
          # 14 green runs 6294-6341 (/actions/tasks; task received -> `> packetforge@0.1.0
          # test` in the leg logs): Node 20 5.8 s, Node 18 9.3 s, Node 22 11.9 s. The Node
          # 20 leg is the same job without this download, so the difference is the download
          # - 3.5 s and 6.1 s of a 46-66 s leg, and it only needs to overlap the checkout
          # to cost nothing.
          #
          # So it starts here, before the git fetch, and the fetch runs over it. The step
          # below waits for this attempt (bounded, and it still falls back to its own
          # download) and unpacks the same tarball from the same pinned URL.
          #
          # It cannot fail this step: the download is detached, every outcome is a marker
          # file, and a prefetch that dies leaves the step below exactly the code it had
          # before. The `case` is duplicated there on purpose - if the two ever disagree the
          # file name does not match and that step downloads its own, which is the behaviour
          # this job had before this block existed.
          case "${{ matrix.node }}" in
            18) PFDIST=v18.20.8 ;;
            22) PFDIST=v22.23.5 ;;
            *) PFDIST="" ;;
          esac
          if [ -n "$PFDIST" ]; then
            PFDIR="${RUNNER_TEMP:-/tmp}/node-prefetch"
            mkdir -p "$PFDIR"
            echo "starting the ${PFDIST} download here, so the checkout below runs over it"
            touch "$PFDIR/$PFDIST.started"
            # Unpacked here, not in the step below: the extraction is 1.3 s and it does
            # not need to be serial with anything either. The tree lands in a temporary
            # directory and is renamed onto /opt/node-<release> once `bin/node` is
            # executable, so a reader never sees a half-unpacked tree, and the marker is
            # written only after that rename.
            nohup sh -c "curl -fsSL --retry 3 --retry-delay 2 --retry-connrefused --connect-timeout 10 --max-time 180 -o '$PFDIR/$PFDIST.tar.gz.part' 'https://nodejs.org/dist/$PFDIST/node-$PFDIST-linux-x64.tar.gz' && rm -rf '/opt/node-$PFDIST.tmp' && mkdir -p '/opt/node-$PFDIST.tmp' && tar -xzf '$PFDIR/$PFDIST.tar.gz.part' -C '/opt/node-$PFDIST.tmp' --strip-components=1 && rm -rf '/opt/node-$PFDIST' && mv '/opt/node-$PFDIST.tmp' '/opt/node-$PFDIST' && [ -x '/opt/node-$PFDIST/bin/node' ] && touch '$PFDIR/$PFDIST.ok' || { rm -rf '$PFDIR/$PFDIST.tar.gz.part' '/opt/node-$PFDIST.tmp'; touch '$PFDIR/$PFDIST.failed'; }" > "$PFDIR/download.log" 2>&1 &
            echo $! > "$PFDIR/$PFDIST.pid"
          fi
          # The runner's working directory is the repository root. Derive the git URL from
          # the instance URL the runner itself is configured with, never a hardcoded host.
          server="${GITHUB_SERVER_URL:-}"
          if [ -z "$server" ]; then
            api="${GITHUB_API_URL:-http://10.0.10.20:3000/api/v1}"
            server="${api%/api/v1}"
          fi
          url="${server}/${GITHUB_REPOSITORY}.git"
          sha="${{ github.sha }}"
          git init -q .
          git remote add origin "$url"
          # One commit, three attempts. The fetch is the only step in this job that talks to a
          # network, and the network answers this runner with aborts that say nothing about
          # the commit: task 13960 (run 5540, Test (Node 22), push 52cff888) died 34 s in
          # with `Operation too slow. Less than 1000 bytes/sec transferred the last 30
          # seconds` while its Node 18 and Node 20 siblings ran the same commit green in
          # 54 s and 53 s, and the smoke and Docker jobs of that run went on to pass - a
          # red X on a tree with nothing wrong with it, and a pull request that cannot
          # merge until somebody re-runs it by hand. That is the one failure a retry is
          # honest for: a second attempt asks the same server for the same commit, and if
          # every attempt fails the job still fails, with the same status and the same
          # message. Nothing is hidden - a commit that does not exist, a token that is not
          # accepted and a repository that is gone all fail every attempt.
          # Three, not more: 3 x 90 s plus 10 s of backoff is a 280 s ceiling, which is
          # below the 300 s a single attempt used to get, so a dead server costs this job
          # less than it did before while a blip no longer costs a whole run. 90 s is also
          # 25x the 3.5 s checkout measured here (run 5719, task 14549), so a slow but
          # working server still passes.
          attempt=1
          rc=1
          while [ "$attempt" -le 3 ]; do
            if [ -n "${TOKEN:-}" ]; then
              timeout 90 git -c "http.extraheader=Authorization: token ${TOKEN}" -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=30 fetch -q --depth=1 origin "$sha" && rc=0 || rc=$?
            else
              timeout 90 git -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=30 fetch -q --depth=1 origin "$sha" && rc=0 || rc=$?
            fi
            if [ "$rc" -eq 0 ]; then
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "fetch of ${sha} failed on attempt ${attempt} of 3 (rc ${rc}) - retrying in 5 s; a transport abort is not a verdict about the commit"
              sleep 5
              attempt=$((attempt + 1))
            else
              break
            fi
          done
          if [ "$rc" -ne 0 ]; then
            echo "::error title=Checkout::${sha} could not be fetched after ${attempt} attempt(s) (rc ${rc}) - no tree means nothing in this job could be tested, so it fails rather than passing on an empty directory"
            exit "$rc"
          fi
          git checkout -q -f --detach FETCH_HEAD
          # The action emptied the directory before it checked out; this is the same
          # guarantee, applied to whatever the runner left in the workspace: after this
          # line the tree is the commit's own files and nothing else.
          git clean -qfdx
          echo "checked out $(git rev-parse HEAD) of ${url} with git - no action cache involved"
      # Every job in this workflow already runs on Node 20: the runner's image for
      # `ubuntu-latest` is `node:20-bookworm`, which is the `Start image=` line at the
      # top of every job log and the reason the `changes` job has never needed a setup
      # step. Downloading Node 20 onto Node 20 cost this leg 25 seconds of a 229-second
      # job (run 3122, task 6833: clone of the setup-node action at 04:27:14, tarball
      # download at 04:27:32), and - because act keeps one cache directory per action
      # revision under /data/.cache/act - it made all three legs clone the same action
      # into the same path within five seconds of each other. That race is not
      # theoretical: in the same run, task 6834 died 22 seconds in with
      #   Unable to checkout 49933ea5288caeca8642d1e84afbd3f7d6820020:
      #   remove /data/.cache/act/e5/877e.../.gitignore: no such file or directory
      # while 6833 and 6835 ran the identical 260-suite suite to completion - the run
      # went red on a tree that was green, and the pull request it belonged to cannot
      # merge while it stays red. Two clones can collide instead of three.
      # The runtime for a leg that is not Node 20, downloaded rather than installed by
      # an action. Two reasons, measured separately.
      #
      # Cost. The Node 20 leg does not run this step at all and every other step of the
      # three legs is identical, so the gap between the legs of one run is the cost of
      # getting a runtime. Over the 24 successful runs 3521-3614 (/actions/tasks), same
      # commit, same two-slot host, medians: Node 20 82 s, Node 18 94 s (+12.5 s),
      # Node 22 102 s (+18.5 s). That is 6-34 s per leg depending on how busy the host is
      # when the two legs clone the action at the same second - and it is paid twice per
      # pull request, because three legs run two at a time.
      #
      # Reliability, and this is the part that matters more. act keeps one cache
      # directory per action revision under /data/.cache/act, so the 18 and 22 legs clone
      # setup-node into the same path within seconds of each other. Run 3122, task 6834
      # died 22 s in with
      #   Unable to checkout 49933ea5288caeca8642d1e84afbd3f7d6820020:
      #   remove /data/.cache/act/e5/877e.../.gitignore: no such file or directory
      # while tasks 6833 and 6835 ran the identical suite to completion - a red X on a
      # green tree, on a pull request that then cannot merge. A tarball has no shared
      # cache to collide in.
      #
      # Pinned for the same reason DOCKER_CLI_VERSION in the `docker` job is: `node-version:
      # 18` resolves to whatever 18.x was newest that morning, so the gate silently
      # changes what it tests between runs. These move only when this file does.
      #
      # The download is not allowed to cost the gate: the fetch is attempted twice (curl's
      # own retries, then one more attempt after a short sleep) before the step gives up,
      # `continue-on-error` keeps the leg alive, and the assertion below is what actually
      # fails the leg - so a wrong-arch, truncated or half-unpacked tarball cannot pass as
      # coverage, whatever this step's own colour is.
      #
      # The `actions/setup-node@v4` fallback that used to sit under this step is gone.
      # Measured, not stylistic. The runner pre-fetches every `uses:` action of a job
      # before it runs the first step - including one whose `if:` is false - and it does
      # not reuse that clone between runs:
      #   run 3877 (PR #1686), Node 22 leg: clone of setup-node at 16:14:17, first real
      #   step at 16:14:49 - 32 s of a 79 s leg spent before any work - and then
      #   `skipping post step for 'actions/setup-node@v4'; main step was skipped`.
      #   run 3884, Node 22 leg: 36 s. run 3887: 22 s (Node 18), 27 s (Node 20), 32 s
      #   (Node 22).
      # In every one of those legs the prepared step never ran: Node 20's leg excludes it
      # by `if:`, and the 18 and 22 legs had already installed from the tarball. So 22-36 s
      # of a 78-95 s job - roughly a third of every test leg, three legs per push - was
      # being paid to hedge a failure that has not happened once in that window.
      # It was never an independent path anyway: setup-node downloads from nodejs.org/dist,
      # the same host and the same tarball this step fetches. A second attempt at that URL
      # keeps the hedge; a pre-cloned action that never executes does not. The major-version
      # assertion below is unchanged, so what this job claims to test is unchanged.
      # Provisioning and the assertion that it worked were two steps: the first could
      # fail without failing the leg (`continue-on-error`), and the second read
      # `node --version` to decide. They are one step now, so the leg pays one boundary
      # instead of two - and the assertion still runs last, so a leg that tested the wrong
      # runtime is red exactly as before, with the same message. The Node 20 leg has
      # nothing to download and reaches the same assertion.
      - name: Provide the runtime this leg is named for
        id: node_runtime
        if: steps.still_open.outputs.closed != 'true'
        env:
          MAJOR: ${{ matrix.node }}
        run: |
          set -eu
          case "$MAJOR" in
            20) DIST="" ;;
            18) DIST=v18.20.8 ;;
            22) DIST=v22.23.5 ;;
            *) echo "::error title=Test (Node ${MAJOR})::no pinned Node release for major ${MAJOR} - add it to this step"; exit 1 ;;
          esac
          if [ -z "$DIST" ]; then
            echo "Node ${MAJOR} is the runner image's own runtime - nothing to download"
          else
            dest="/opt/node-${DIST}"
            url="https://nodejs.org/dist/${DIST}/node-${DIST}-linux-x64.tar.gz"
            # `fetch` is all-or-nothing: a truncated tarball or a failed unpack must not leave
            # a half-populated /opt/node-* behind for the second attempt to bolt onto.
            fetch() {
              rm -rf "${dest}" "${dest}.tar.gz"
              mkdir -p "${dest}"
              echo "fetching ${url} for Node ${MAJOR} (attempt ${1})"
              curl -fsSL --retry 3 --retry-delay 2 --retry-connrefused --connect-timeout 10 --max-time 180 -o "${dest}.tar.gz" "$url" &&
                tar -xzf "${dest}.tar.gz" -C "${dest}" --strip-components=1 &&
                [ -x "${dest}/bin/node" ]
            }
            # That download may already be running, or finished: the step above started it,
            # tarball and unpack both, before the checkout. Wait for it, bounded, and use the
            # tree it produced. Anything other than a complete, executable /opt/node-<release>
            # falls through to the same two attempts this step has always made, so the only
            # thing the prefetch can change is the clock.
            PFDIR="${RUNNER_TEMP:-/tmp}/node-prefetch"
            if [ -e "$PFDIR/${DIST}.started" ] && [ ! -e "$PFDIR/${DIST}.ok" ] && [ ! -e "$PFDIR/${DIST}.failed" ]; then
              echo "waiting for the ${DIST} download started during the checkout"
              for _ in $(seq 1 60); do
                if [ -e "$PFDIR/${DIST}.ok" ] || [ -e "$PFDIR/${DIST}.failed" ]; then break; fi
                sleep 1
              done
              # Still nothing after 60 s: the detached attempt is wedged or was killed with
              # the step that started it. Stop it before taking the tree apart, so the two
              # cannot write to /opt/node-${DIST} at once.
              if [ ! -e "$PFDIR/${DIST}.ok" ] && [ ! -e "$PFDIR/${DIST}.failed" ]; then
                if [ -s "$PFDIR/${DIST}.pid" ]; then
                  kill "$(cat "$PFDIR/${DIST}.pid")" 2>/dev/null || true
                  sleep 2
                fi
                touch "$PFDIR/${DIST}.failed"
              fi
            fi
            if [ -e "$PFDIR/${DIST}.ok" ] && [ -x "${dest}/bin/node" ]; then
              echo "unpacked ${DIST} from the download that overlapped the checkout"
            else
              fetch 1 || { echo "first attempt at ${url} failed - retrying once in 5 s"; sleep 5; fetch 2; }
            fi
            # Over the image's own Node 20, not beside it: the assertion below reads
            # `node --version`, and a second runtime earlier on PATH would let it pass while
            # `npm test` still ran on the runtime the image shipped.
            for b in node npm npx; do ln -sf "${dest}/bin/${b}" "/usr/local/bin/${b}"; done
            echo "installed $(command -v node): $(node --version) / npm $(npm --version)"
          fi
          # The saving above is only a saving if the runtime really is the version the leg
          # is named for. A leg that quietly tested Node 22 under the name "Test (Node 20)"
          # would report coverage it never had, which is the failure this repository has
          # already paid for twice (runs 1398/1401/1402). So every leg checks, and a
          # runner image that changes underneath this file fails loudly here instead.
          want="${{ matrix.node }}"
          got="$(node --version)"
          echo "wanted Node ${want}, running ${got} ($(npm --version))"
          case "$got" in
            "v${want}."*) exit 0 ;;
          esac
          echo "::error title=Test (Node ${want})::this leg is running ${got} - it would report coverage for a runtime it never tested"
          exit 1
      # `node scripts/check-control-bytes.js` used to run here as its own step, and this is
      # the one place in the workflow where a check really was paid for twice: `npm test`
      # is `node scripts/audit-port-types.js && node scripts/check-control-bytes.js && node
      # scripts/run-tests.js` (package.json), so the byte scan already runs as the second
      # command of the step further down - same tree, same leg, same exit status. The leg
      # fails either way, and it names the offending file either way.
      #
      # Measured on run 4834, job 2 (`Test (Node 20)`, 44.2 s from image start to
      # `Job succeeded`): the standalone scan printed "No control bytes in source." at
      # 06:17:18.394 and the copy inside `npm test` printed the identical line at
      # 06:17:21.067 - the same check, twice, 1.1 s apart, inside one leg. At three legs a
      # run and ~200 pull-request runs a day that is roughly 11 minutes of runner time a
      # day spent re-answering a question the previous step had answered.
      #
      # So the second invocation goes, and only it: the script, its arguments and its exit
      # status are unchanged, and it still runs in every leg of the matrix.
      # The five checks below and after the suite - three read-only scans and two example
      # builds - were the only places left in this job with no bound of their own, and that
      # is what a kill at the job timeout costs: run
      # 5616, task 14236 - dead at 900 s, and its log does not exist, so a red gate could not
      # name the step that hung. A step that gives up on its own keeps its log and prints its
      # own name (the suite does this at 300 s, the syntax check at 120 s), which is strictly
      # more than the runner's kill leaves behind.
      #
      # Green, these five take 0.3-1.8 s in total - run 5664, tasks 14388-14390: the three
      # static checks 22:10:51.4 -> 22:10:52.7, the two example steps 22:11:36.2 ->
      # 22:11:36.9, and re-measured on this tree at 5e6bc405 as 0.98 + 0.75 + 0.10 s for the
      # three scans - so 60 s and 120 s are two orders of magnitude of headroom, and a slow
      # host cannot turn one of them red on time alone. Nothing is skipped, softened or
      # retried: a timeout here is a red leg that names the step and how long it ran.
      # The three read-only scans that used to be three steps of their own, here, in front
      # of the suite. They were serial with it for no reason: each one reads files that the
      # suite only reads, and the syntax check has been overlapping that same suite since
      # 2026-11-16 (see the note on the step below). Measured on this tree at 5e6bc405,
      # same scripts, on the runtime the runner image carries: check-node-surface.js 0.98 s,
      # check-canonical-urls.js 0.75 s, check-ci-disk-hygiene.js 0.10 s - 1.8 s of every
      # leg's prologue, in front of a 40 s suite, on the one leg that is the wall clock of a
      # pull request - plus two extra step starts per leg, three legs.
      #
      # They now start in the background beside the suite, in the same step, with the same
      # scripts, the same 60 s bound each, the same exit status and the same ::error title
      # per check. Nothing is skipped, softened or dropped from any leg: every check still
      # runs in all three legs, on the runtime that leg is named for, and a non-zero exit
      # still fails the leg. What moves is when a red is reported - at the end of the step,
      # alongside the suite, instead of two seconds into the leg. The leg is red either way,
      # and it is the second red that a pull request actually waits for.
      # The syntax check used to be its own step in the middle of the static checks, and
      # it sat in front of the suite for no reason. It is one `node --check` process per file, 339 of them, one
      # after another: measured in the runner image on this host (node:20-bookworm,
      # 2026-11-16) 18.6 s, against 46.4 s for the suite at PF_TEST_CONCURRENCY=4 (33-36 s
      # at the 6 this file runs now, see the note on that step). Two
      # costs with nothing in common - process spawns against actual tests - run end to
      # end in every leg, so every leg paid 65.0 s where 51.9 s does the same work.
      #
      # They now run at once and the step waits for both. Coverage is identical: every
      # file is still syntax-checked, in all three legs, on the runtime that leg is named
      # for. The cost is that a syntax error is reported when the suite finishes rather
      # than in the first two seconds - the leg is red either way, and it is the second
      # red that a pull request actually waits for.
      #
      # Every exit code in the phase is collected before any of them is acted on: a
      # `set -e` here would let the first failure hide the other results, which is the
      # difference between "the syntax is broken" and "the syntax is broken and the suite
      # is too". The same rule now covers the three read-only scans that start here too.
      - name: Full test suite, syntax check and static checks, together
        if: steps.still_open.outputs.closed != 'true'
        # 200 s per leg, three legs, two runner slots: the suite is the whole wall clock of
        # a pull request, and it was running 257 separate processes one at a time on one
        # core. The runner now takes `PF_TEST_CONCURRENCY` (default 1, so a local `npm
        # test` is unchanged) and prints results in discovery order, which is why the
        # concurrent log diffs against the serial one with only the timings moved.
        #
        # Measured on the same working copy, same 257 suites, same 9387 assertions, same
        # single pre-existing failure (main's spec-vs-description, see the note on the pull
        # request): 340 s serial, 148 s at 4, 118 s at 6. Those numbers come from the
        # serial harness this step replaced, and they are why 4 was chosen: the guess was
        # that two legs sharing one host would fight for the same cores at 6.
        #
        # Re-measured on 2026-11-16 against the harness that actually runs now (281
        # suites, 10063 assertions), in the runner's own node:20-bookworm image on a
        # docker volume on odin - the same runtime and the same filesystem class as a real
        # leg - with two legs started at the same second and both halves of this step
        # (syntax check and suite) running at once, exactly as below:
        #   4: 48 s, 48 s  (48 s for one leg alone, so no measurable contention penalty)
        #   6: 36, 36, 35, 35 s
        # All of them green: 281 suites / 10063 assertions in every leg, which is the
        # coverage the matrix already had. The guess above was wrong for this harness: the
        # cost being overlapped is 281 process spawns, not 10063 CPU-bound assertions, and
        # 12 node processes on the 40 cores this host has is not a fight. Hence 6, which is
        # 13 s less per leg - 39 s of runner time per pull request, and 13 s off each of the
        # two waves a three-leg matrix costs the queue.
        #
        # Re-measured again on 2026-11-16 (285 suites, 10234 assertions, node:20-bookworm on
        # odin, commit eb172083) because the suite has grown past what 6 was chosen for:
        #   6:  31.9 s     10: 21.9 s     12: 20.6 s     (one leg, nothing else running)
        # Three legs started at the same second, each with its own working copy - what the
        # matrix actually does on this host:
        #   6:  60.5, 60.1, 60.6 s         10: 38.3, 38.2, 38.3 s
        # Same 285 suites and the same ~10230 assertions in every leg; the only failure in
        # any of the six runs was canonical-urls' "the tree is clean again" probe, which
        # fails identically at 6 and at 10 and only in the benchmark copies, never in a
        # real leg (runs 3987, 3983, 3979 are green on this commit).
        #
        # So 10, not 12: 12 buys 1.3 s over 10 on an idle host and allocates a fifth more
        # processes under the three-leg contention where the real cost is paid. The bound
        # that matters is the harness's own cap of 16 and the 40 cores underneath.
        #
        # Re-measured on 2026-11-18 because the suite grew past what 10 was chosen for:
        # 344 suites / 11933 assertions now, against the 285 / 10234 that number was
        # picked on. Same method, node:20-bookworm on odin, the same commit cloned from
        # Forgejo (d4ea0dd, the head of main at the time), each configuration run alone
        # and then three copies started at the same second - one per leg, which is what
        # the matrix actually pays:
        #   one leg alone:      10: 24.8 s     14: 20.4 s     16: 19.1 s
        #   three legs at once: 10: 43.9, 43.9, 43.5 s      16: 39.2, 39.0, 38.9 s
        # All six contended runs reported the same 344 suites and the same 11933
        # assertions, 0 failed, so the only thing that moves between 10 and 16 is the
        # clock. That matches what the real legs do today: the suite line in task 16672
        # (run 6441, `Test (Node 20)`, a push to main, 2026-11-18T16:24:36Z) reads
        # `344 suite(s) in 40.4 s - 11933 assertions passed, 0 failed` at 10.
        #
        # 16 was measured, merged as 8b8348e9 at 16:42:53, and taken back out the same
        # evening, because the 4.7 s it returns per leg was paid for with red mains.
        #
        # The benchmark above started three legs and nothing else. The queue does not look
        # like that. A merge on main fires the rebase pass, which force-pushes every open
        # pull request that is behind main, and each of those is a new run asking for three
        # more legs - so five and six legs are in flight at once: tasks 16900-16907 are PRs
        # #2011 and #2012 overlapping, and 16923-16936 overlap each other and the Docker
        # build. At 16 that is 80-96 node processes on this host's 40 cores and 31 GB with
        # no swap, where 30-50 is what the widths in this file were chosen against.
        #
        # Two suites in this tree assert wall-clock tripwires of their own:
        # `test/state-payload-shape.test.js` budgets 60 ms for a 200-cable payload its own
        # comment calls "a few milliseconds", and `test/palette-search-keys.test.js` ceilings
        # a warm catalogue filter at 25 ms. Both are loose against an idle machine and both
        # read the queue when it is oversubscribed. In the 80 minutes after this 16 landed,
        # every red test leg sampled (8 of 8) was one of those two, and main went red four
        # times on them:
        #   task 16773 (main, 17:09:42)  state payload 113.9 ms of 60
        #   task 16821 (main, 17:45:12)  warm filter 39.48 ms of 25
        #   task 16924 (main, 18:08:50)  warm filter 28.81 ms of 25
        #   task 16933 (main, 18:09:40)  state payload 130.7 ms of 60
        # plus pull-request legs 16900/16901 (#2011, 106.8 and 71.9 ms), 16829 (#2005,
        # 83.8 ms) and 16952 (#2015, 80.0 ms) at 18:23. In the eight hours before it, over
        # ~400 legs, two such legs reported.
        #
        # 10 is not a cure: the same tripwires fired on 2026-11-17 between 00:00Z and 05:00Z
        # with this 10 in place, when six legs were in flight again (14 legs). What 10 does is
        # halve what this file adds to that contention, for the 4.7 s per leg measured above -
        # 344 suites and 11933 assertions in every leg at either width, so no coverage moves.
        # The tripwires belong in `test/`, which this stream does not write; until they
        # measure the code instead of the host, a leg that reports the queue is worth more
        # than five seconds, and a red main is worth more still.
        #
        # Re-measured on 2026-11-20, and 10 is still the answer - now for a measured
        # reason rather than the old one. The tree this width was picked on has grown
        # (397-399 suites, 13248-13279 assertions, against 344 / 11933 on 2026-11-18),
        # and the objection to 16 - that a tripwire firing under load reddens `main` -
        # was answered at 03:08 today by the re-verification below (2e16ded4). So 13 was
        # tried on a real pull request and measured against a 10-wide run on the same
        # tree, twenty minutes apart:
        #
        #   run 8265 (10-wide, 399 suites, 04:54:50Z): 61.1 / 57.2 / 50.9 s,
        #     suite CPU 571 / 530 / 467 s, effective parallelism 9.4 / 9.3 / 9.2
        #   run 8271 (13-wide, 399 suites, 04:59:56Z): 64.3 / 60.9 / 57.0 s,
        #     suite CPU 779 / 737 / 685 s, effective parallelism 12.1 / 12.1 / 12.0
        #
        # 13 workers did hold 12 of them busy, and every suite still ran (399 suites,
        # 13279 assertions, 0 failed, in each leg) - but the leg was 3.2 s slower and
        # burned 36% more CPU-seconds for the same coverage. The width was never the
        # bound: ten workers already reach 9.4 of ten here, which means every worker has
        # a core, and the cores behind them belong to the host, not to this workflow.
        # Adding workers past that point does not shorten the leg, it lengthens each
        # suite (1.43 s per suite at 10, 1.95 s at 13) and spends the difference on
        # contention. So the useful reading of the old number stands, with the new
        # evidence behind it: this leg's wall clock is the host's spare cores, and a
        # wider pool can only price that contention higher. What would move it is fewer
        # CPU-seconds per suite, which is `test/`, not this file.
        #
        # Nothing about coverage is involved in either direction: 399 suites and 13279
        # assertions ran green in all six legs above, at both widths.
        env:
          PF_TEST_CONCURRENCY: 10
        run: |
          # Actions runs this file as `bash -e`, and that is the default this step has to
          # leave: without it the first non-zero exit - `npm test` failing, which is the
          # usual colour of a red leg - ends the script at that line. The syntax check's
          # result is then never collected and never printed, so the leg reports one
          # check where it ran two. Measured on run 3410, task 7302: the tail of this step
          # did not execute and no syntax-check output appeared in the log.
          set +e
          set -u
          # Width follows the leg's own work: the same 430 suites cost the Node 18 runtime
          # about a fifth more CPU than they cost Node 22 (571 against 467 CPU-seconds for
          # the 399 suites of run 8265), so at an equal width the floor is always the leg
          # still running when its two siblings have reported, and the pull request's wall
          # clock is that leg. Measured on this tree at 3387122b, one leg at a time on an
          # idle host, 430 suites / 14367 assertions green in every run: 10 workers
          # 28.5 s, 11 workers 27.0 s, 12 workers 24.9 s. So the floor gets 12 and the
          # other two keep the 10 that was measured best for them - 32 workers of the 40
          # cores this host has, against the 39 that made every leg 3.2 s slower in run
          # 8271. Coverage is unchanged: same suites, same assertions, same runtime in
          # every leg; only how many of that leg's suites run at once changes, and the
          # isolated re-run below still decides any suite that loses a race at the new
          # width.
          if [ "${{ matrix.node }}" = "18" ]; then
            export PF_TEST_CONCURRENCY=12
          fi
          echo "suite width: ${PF_TEST_CONCURRENCY} workers on Node ${{ matrix.node }}"
          # Outside the working tree: a log file in the repo root is one more thing a
          # later step might trip over, and nothing here needs to read it back.
          dir="${RUNNER_TEMP:-/tmp}"
          out="${dir}/syntax-check.log"
          # The suite is the one thing in this job that can wait forever, and until now it
          # had no bound of any kind. `timeout-minutes` at the top of the job is not the bound
          # anyone wants: it reads 10 now, and when it fires the runner kills the container and
          # the log dies with it - task 14236 (run 5616) ran exactly 900 s against the old 15
          # and its log is the string `dbfs open "actions_log/.../14236.log.zst": file does
          # not exist`. So a leg whose suite never finishes holds a runner slot and then
          # reports nothing at all. Three legs did that in the 24 h to 2026-11-17 18:20, and
          # every one of them left no log, because the process was killed instead of exiting:
          #   task 13665 (run 5449, Test (Node 20), push), cancelled 178 s in, and the log is
          #     dbfs open "actions_log/.../13665.log.zst": file does not exist
          #     - its Node 18 and Node 22 siblings ran the same commit in 60 s and went green;
          #   task 12050 (run 4949, Test (Node 20), push), 180 s, the same missing-log line;
          #   task 10661 (run 4536, Test (Node 18), push), 349 s, the same.
          # That is a red gate nobody can diagnose, and ~12 minutes of a shared runner in a
          # day. So the bound lives in the step, at 300 s. Green legs are 46-69 s over the last
          # 120 (median 54 s) and the suite alone 44.6-47.5 s (runs 5439, 5456, same host), so
          # 300 s is more than four times the slowest green leg: a slow but working suite still
          # passes, and the 16-way harness cap means a leg cannot be slow because it queued.
          # A hung one is still red - it just stops holding the slot, and it keeps its log,
          # because Node is signalled and the step exits with its own status. `timeout` puts
          # the child in its own process group, so npm's chain - and the suite that hung - dies
          # with it, and --kill-after escalates if the suite ignores SIGTERM.
          # The syntax check gets 120 s on the same argument (18.6 s measured for the whole
          # tree). Nothing is skipped, retried or weakened: same suites, same commit, same exit
          # status, and a timeout is reported as a timeout rather than as a failing assertion.
          # One sweep per run, on the Node 18 leg, 8 files at a time - not three.
          #
          # The sweep parses every JavaScript file under the seven source directories, and it
          # ran in all three legs on the identical tree: three answers to one question, each
          # one a serial `node --check` (~19 s of the 8-core host it was measured on, 32.2 s
          # on this one on 2026-11-20 over 485 files) competing with a 10-way suite for the
          # same cores. Measured on this tree, one leg, back to back: `node
          # scripts/syntax-check.js` alone 32.2 s; the same 485 `node --check` parses 8 at a
          # time 2.8 s. A parse is a pure function of the file and the parser, so the second
          # and third copies could only say what the first one said.
          #
          # So it runs once, in the leg named for the oldest runtime in the matrix (`engines:
          # >=18`) - the strictest parser, and the case the sweep exists for - over the same
          # seven directories and with the same `node --check`, 8 at a time. Every leg still
          # executes every file: 20 and 22 run the whole suite, which requires the tree.
          # Same 120 s bound, same exit status, same `Syntax check (all JS)` title, so a file
          # that does not parse is still red and still names itself; what goes is two
          # redundant sweeps and their contention with the suites beside them.
          syntax_rc=0
          syntax_pid=""
          if [ "${{ matrix.node }}" = "18" ]; then
            timeout --signal=TERM --kill-after=15 120 bash -o pipefail -c '
              set -u
              list="$1"
              find engine server devices web scripts examples test -type f -name "*.js" -print0 > "$list"
              echo "syntax-check: $(tr -cd "\000" < "$list" | wc -c | tr -d " ") JavaScript files, node --check 8 at a time, on $(node --version)"
              xargs -0 -r -P 8 -n 1 node --check < "$list"
            ' bash "$dir/syntax-check.list" > "$out" 2>&1 &
            syntax_pid=$!
          fi
          # The three static checks, same scripts and same 60 s bound they had as steps of
          # their own, started here so they run over the suite instead of in front of it.
          # Their logs go to the same place the syntax check's does - outside the tree - and
          # each exit status is collected below, not short-circuited.
          timeout --signal=TERM --kill-after=10 60 node scripts/check-node-surface.js > "$dir/check-node-surface.log" 2>&1 &
          node_surface_pid=$!
          timeout --signal=TERM --kill-after=10 60 node scripts/check-canonical-urls.js > "$dir/check-canonical-urls.log" 2>&1 &
          canonical_urls_pid=$!
          timeout --signal=TERM --kill-after=10 60 node scripts/check-ci-disk-hygiene.js > "$dir/check-ci-disk-hygiene.log" 2>&1 &
          disk_hygiene_pid=$!
          # `npm test` is three commands in a row - `node scripts/audit-port-types.js &&
          # node scripts/check-control-bytes.js && node scripts/run-tests.js` - and the
          # first two are read-only scans of the tree the suite is about to read. They sat
          # in front of the suite, so every leg paid for both before a single suite began:
          # measured on this tree on 2026-11-19 (same working copy, three runs each) 1.02 s
          # for audit-port-types and 0.40 s for check-control-bytes - the 1.4 s that
          # `npm test` spends after `> packetforge@0.1.0 test` and before the first suite
          # line in every leg log. Three legs a run, on the job that is a pull request's
          # wall clock: the green legs to run 7187 are task 18863 (Node 18, 65 s), 18864
          # (Node 20, 57 s) and 18865 (Node 22, 58 s), against a 364-suite / 12420-
          # assertion suite that takes 24-40 s of it.
          #
          # So they run beside the suite now, exactly as the syntax check and the three
          # read-only scans below already run, with their own 60 s bounds, their own logs
          # outside the tree and their own ::error titles. Nothing is skipped, softened or
          # retried: both still run in every leg, on the runtime that leg is named for, and
          # a non-zero exit still fails the leg. What changes is where a red is reported -
          # at the end of the step, next to the suite, instead of 1.4 s into it - and that a
          # failing scan no longer stops the suite from running: `npm test`'s `&&` chain
          # reported the scan and nothing else, this reports both.
          #
          # The split is conditional on `npm test` still being that exact chain, read from
          # package.json here rather than assumed: a fourth command added to it later would
          # be a check this step had silently stopped running. Anything other than the
          # expected string, including a package.json that will not parse, runs `npm test`
          # whole - the behaviour this step had before.
          #
          # The fourth command arrived on 2026-11-20 (#2301, commit e0d34f42, 19:08Z:
          # `node scripts/audit-devices.js` between audit-port-types and check-control-bytes)
          # and this string did not, so from that push every leg fell through to the
          # fallback: `npm test` whole, the scans serial in front of the suite,
          # audit-port-types and check-control-bytes each paid twice, and audit-devices with
          # no ::error title of its own - a red there was reported as "Full test suite
          # exited 1". Measured on this tree at 59b1e7eb, three runs each,
          # PF_TEST_CONCURRENCY=10, node v26 on odin: `npm test` whole 28.7 s against 26.0 s
          # for the same four commands with the three scans overlapped - 2.7 s of every leg,
          # and the legs are a pull request's wall clock (tasks 22700/22701/22702, run 8599:
          # 62/58/58 s, of which the suite is ~40 s).
          #
          # So the chain is the four commands package.json actually has, audit-devices runs
          # beside the other two scans with its own 60 s bound and its own title, and the
          # mismatch path is a ::warning that names the drift. It stayed silent for 1.5
          # hours because it was plain text in a log nobody reads; a warning shows up on the
          # run and on the pull request. Nothing is skipped either way - the fallback still
          # runs every command, it just pays for them one after another.
          want="node scripts/audit-port-types.js && node scripts/audit-devices.js && node scripts/check-control-bytes.js && node scripts/run-tests.js"
          have=$(node -e 'process.stdout.write((require("./package.json").scripts || {}).test || "")' 2>/dev/null || echo "")
          if [ "$have" != "$want" ]; then
            echo "::warning title=CI overlap drift::package.json scripts.test is not the four-command chain this step overlaps (${have:-<missing>}) - every leg is paying the scans in front of the suite again; update the chain in this step"
            timeout --signal=TERM --kill-after=15 300 npm test
            test_rc=$?
            audit_rc=0
            audit_devices_rc=0
            control_rc=0
          else
            timeout --signal=TERM --kill-after=10 60 node scripts/audit-port-types.js > "$dir/audit-port-types.log" 2>&1 &
            audit_pid=$!
            timeout --signal=TERM --kill-after=10 60 node scripts/audit-devices.js > "$dir/audit-devices.log" 2>&1 &
            audit_devices_pid=$!
            timeout --signal=TERM --kill-after=10 60 node scripts/check-control-bytes.js > "$dir/check-control-bytes.log" 2>&1 &
            control_pid=$!
            # A red suite that passes alone is not a verdict about the tree.
            #
            # This leg runs 397-399 suites at a time (PF_TEST_CONCURRENCY=10 below), and a
            # handful of them assert wall-clock budgets or bind a loopback port - so a leg
            # can fail on the host rather than on the commit, while its two siblings run the
            # identical tree green seconds later. All three of the red `main` runs in the 16
            # hours to 2026-11-20T02:27Z are exactly that shape, and in each one the failed
            # leg named a suite whose siblings passed the same commit:
            #
            #   run 8124 (task 21480, Test (Node 18), push to main, 2026-11-20T01:38:55Z):
            #     `394 suite(s) in 52.8 s - 13178 assertions passed, 1 failed`,
            #     test/server-immutable-json.test.js, `Error: connect ECONNREFUSED
            #     127.0.0.1:42267` - a loopback port the suite had probed and closed itself.
            #     Tasks 21481/21482 (Node 20/22) ran the same commit green.
            #   run 7520 (task 19803, Test (Node 18), 2026-11-19T12:39:43Z): 1 failed,
            #     test/state-payload-shape.test.js, `a state payload for 200 cables costs
            #     66.7 ms (budget 60)`. Tasks 19804/19805 green on the same commit.
            #   run 7345 (task 19316, Test (Node 22), 2026-11-19T09:11:13Z): 7 failed in
            #     test/link-instant.test.js and test/link-roundtrip.test.js, 12425
            #     assertions against the 12467 its two siblings reported. Tasks 19314/19315
            #     green.
            #
            # Three red mains in sixteen hours, none of them about the commit they were
            # attached to, and each one costs a full matrix and blocks the merge behind it.
            # A retry that hides a real failure is the thing this repository has paid for
            # before, so this one is deliberately narrow, bounded and loud:
            #   * it fires only when the suite exited with a failure that is not a timeout
            #     (124/137 stays red - a hung suite is not a race) and named suite files,
            #   * it fires only when at most 6 suites failed; a broader failure is a broken
            #     tree and stays red with nothing re-run,
            #   * each named suite is re-run once, alone - after every background check in
            #     this step has been waited for, so nothing else is competing - on the same
            #     tree, the same runtime, bounded at 90 s, with its own output in the log,
            #   * if any suite fails alone, the leg is red and that suite's log is above,
            #   * if they all pass, the leg is green and a `::warning::` names every suite
            #     that failed in parallel, so the flake is reported rather than erased.
            # Nothing is skipped or softened: every suite still runs in every leg of the
            # matrix, and the ones that fail run a second time. Coverage is unchanged; what
            # changes is which run of a suite decides the colour of the leg.
            timeout --signal=TERM --kill-after=15 300 node scripts/run-tests.js 2>&1 | tee "$dir/suite.log"
            test_rc=${PIPESTATUS[0]}
            wait "$audit_pid"
            audit_rc=$?
            wait "$audit_devices_pid"
            audit_devices_rc=$?
            wait "$control_pid"
            control_rc=$?
          fi
          if [ -n "${syntax_pid}" ]; then
            wait "$syntax_pid"
            syntax_rc=$?
          fi
          wait "$node_surface_pid"
          node_surface_rc=$?
          wait "$canonical_urls_pid"
          canonical_urls_rc=$?
          wait "$disk_hygiene_pid"
          disk_hygiene_rc=$?
          # A suite that failed at 10-way concurrency and passes on its own is the host,
          # not the tree - see the measured note above the suite. Re-run exactly those, one
          # at a time, now that every background check in this step has finished.
          if [ "$test_rc" -ne 0 ] && [ "$test_rc" -ne 124 ] && [ "$test_rc" -ne 137 ] && [ -f "$dir/suite.log" ]; then
            flaked=$(grep -oE 'test/[A-Za-z0-9._/-]+\.test\.js$' "$dir/suite.log" 2>/dev/null | sort -u | tr '\n' ' ' | sed 's/ *$//')
            count=$(printf '%s' "$flaked" | wc -w | tr -d ' ')
            if [ "$count" -eq 0 ]; then
              echo "the suite exited ${test_rc} and named no suite file - a harness that cannot say what failed is not a flake, so nothing is re-run and the leg stays red"
            elif [ "$count" -gt 6 ]; then
              echo "${count} suites failed together (${flaked})- that is a broken tree, not one suite losing a race, so nothing is re-run and the leg stays red"
            else
              alone_failed=""
              for f in $flaked; do
                if [ ! -f "$f" ]; then
                  echo "the suite named ${f} but it is not in this tree - the leg stays red"
                  alone_failed="${alone_failed} ${f}"
                  continue
                fi
                echo "--- re-running ${f} on its own: it failed at ${PF_TEST_CONCURRENCY}-way concurrency, this is the same tree and the same runtime ---"
                if timeout --signal=TERM --kill-after=10 90 node "$f"; then
                  echo "${f} passes when it is the only suite running"
                else
                  rc=$?
                  echo "${f} fails on its own too (exit ${rc}) - that is the commit, not the host"
                  alone_failed="${alone_failed} ${f}"
                fi
              done
              if [ -z "$alone_failed" ]; then
                echo "::warning title=Suite flake (re-verified)::${count} suite(s) failed at ${PF_TEST_CONCURRENCY}-way concurrency and each one passes on its own on the same tree: ${flaked}. Every suite ran in this leg; these ran a second time in isolation and passed."
                test_rc=0
              fi
            fi
          fi
          if [ -f "$out" ]; then
            echo "--- node --check, every JavaScript file, on the Node 18 parser ---"
            cat "$out"
          fi
          for log in check-node-surface check-canonical-urls check-ci-disk-hygiene; do
            echo "--- node scripts/${log}.js ---"
            cat "$dir/${log}.log"
          done
          for log in audit-port-types audit-devices check-control-bytes; do
            [ -f "$dir/${log}.log" ] || continue
            echo "--- node scripts/${log}.js ---"
            cat "$dir/${log}.log"
          done
          if [ "$syntax_rc" -eq 124 ] || [ "$syntax_rc" -eq 137 ]; then
            echo "::error title=Syntax check (all JS)::the sweep was still running after 120 s and was stopped - 485 files 8 at a time take 2.8 s here, so this is a sweep that stopped moving, not a slow one"
          elif [ "$syntax_rc" -ne 0 ]; then
            echo "::error title=Syntax check (all JS)::node --check rejected at least one file (exit ${syntax_rc}) - the files and their errors are printed above"
          fi
          if [ "$test_rc" -eq 124 ] || [ "$test_rc" -eq 137 ]; then
            echo "::error title=Full test suite::the suite was still running after 300 s and was stopped - a green leg takes 46-69 s here, so this is a hung suite, not a slow one; the suites that had already reported are above"
          elif [ "$test_rc" -ne 0 ]; then
            echo "::error title=Full test suite::npm test exited ${test_rc}"
          fi
          # Same two outcomes per static check as when each was a step of its own: a stop
          # after its own 60 s bound is named as a stop, any other non-zero exit as an exit.
          report_static() {   # $1 = script name, $2 = exit status
            if [ "$2" -eq 124 ] || [ "$2" -eq 137 ]; then
              echo "::error title=${3}::node scripts/$1.js was still running after 60 s and was stopped - a green run takes about a second"
            elif [ "$2" -ne 0 ]; then
              echo "::error title=${3}::node scripts/$1.js exited ${2}"
            fi
          }
          report_static check-node-surface "$node_surface_rc" "No API newer than the Node 18 floor"
          report_static check-canonical-urls "$canonical_urls_rc" "Every project URL points at Forgejo"
          report_static check-ci-disk-hygiene "$disk_hygiene_rc" "Every job that builds an image bounds what it writes"
          report_static audit-port-types "$audit_rc" "Port types declared in every device spec"
          report_static audit-devices "$audit_devices_rc" "Device specs are cabled and described plausibly"
          report_static check-control-bytes "$control_rc" "No control bytes in source"
          [ "$test_rc" -eq 0 ] && [ "$syntax_rc" -eq 0 ] &&
            [ "$node_surface_rc" -eq 0 ] && [ "$canonical_urls_rc" -eq 0 ] &&
            [ "$disk_hygiene_rc" -eq 0 ] && [ "$audit_rc" -eq 0 ] &&
            [ "$audit_devices_rc" -eq 0 ] && [ "$control_rc" -eq 0 ]
      # Two steps became one: the catalogue check reads what `build-examples.js` writes,
      # so the order is unchanged, and the leg no longer pays a step boundary between
      # them. Same commands, same bounds, same exit status - a stop is still named.
      - name: Build & verify example labs
        if: steps.still_open.outputs.closed != 'true'
        run: |
          set +e
          timeout --signal=TERM --kill-after=10 120 node examples/build-examples.js
          build_rc=$?
          if [ "$build_rc" -ne 0 ]; then
            if [ "$build_rc" -eq 124 ] || [ "$build_rc" -eq 137 ]; then
              echo "::error title=Example labs::the example build was still running after 120 s and was stopped"
            fi
            exit "$build_rc"
          fi
          timeout --signal=TERM --kill-after=10 120 node scripts/missing-devices.js examples --no-issues
          rc=$?
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
            echo "::error title=Lab models::the catalogue check was still running after 120 s and was stopped"
          fi
          exit "$rc"

  # One slot, two checks. `Server smoke test` and `Docker build` were separate jobs, and on
  # this runner they could not overlap: three slots are held by the test legs for ~60 s and
  # the fourth carried `Classify the change`, then the smoke test, then the image build, one
  # after another. Measured over the last 60 pull-request runs (run ids 7607-7974,
  # /actions/tasks): the `Docker build` task was created a median 2 s AFTER the
  # `Server smoke test` task had finished (p10 -1 s, p90 +3 s), so the two never overlapped
  # once in those runs, and in 24 of the 60 the build was still running after every test leg
  # had reported - a median 11 s past them and 97 s at worst (run 7913: legs done at +69 s,
  # Docker build done at +115 s). Each of those two jobs also paid its own 5.3 s checkout of
  # the same commit into its own container.
  #
  # Neither check reads anything the other writes, and both want the same tree and the same
  # Node 20 image: `scripts/smoke-http.js` listens on 127.0.0.1 on an ephemeral port and
  # keeps its state under `os.tmpdir()`, and the image build reads the tree through the host
  # daemon. So they are one job: one checkout, one container, and the 10 s HTTP smoke runs
  # beside the 20 s image build instead of in front of it. That is one slot instead of two
  # back to back, on a host where the fourth slot is what the whole tail of a run waits on.
  #
  # Nothing is skipped, softened or retried. Same `scripts/smoke-http.js`, same 180 s bound,
  # same eight Dockerfile static checks, same `docker build -t packetforge:ci-run-<run>` with
  # its 180 s bound, same prune that runs even when the build fails, same
  # `::error title=Server smoke test` and `::error title=Docker build` titles, so a red still
  # names which of the two checks failed. What moves is when the smoke result is printed: at
  # the end of the job, beside the build's, instead of 11 s into it - the same move the test
  # legs already made for their static checks, and the job is red either way.
  #
  # This is the sixth status a run posts, where it used to be seven. `arm` below requires the
  # three test legs by name and every status on the head to be green; it does not name these
  # two, so it agrees with the server about "green" exactly as before.
  arm:
    name: Arm auto-merge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [test, docker]
    # `always()` so a red leg still runs this gate and reports why it did not merge, and
    # no `changes` edge any more: the liveness question that edge carried for this job is
    # asked in the step below, in the same shape the test legs use.
    if: always() && github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Merge once every check has reported green
        env:
          TOKEN: ${{ secrets.FORGEJO_TOKEN || secrets.GITHUB_TOKEN || github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -u
          api="${GITHUB_API_URL:-http://10.0.10.20:3000/api/v1}"
          repo="$GITHUB_REPOSITORY"
          note() { echo "::warning title=Auto-merge::${*}" >&2; echo "${*}"; }
          # The question the deleted `Classify the change` job used to answer for this
          # step, asked here instead - the same call, the same rule and the same direction
          # as the legs' `still_open` step: only a positive `merged: true` or
          # `state: closed` stands the job down. An unreadable reply arms exactly as it
          # did before, because a live pull request must not lose its arm to one failed
          # API call. Without this, a run dispatched before a merge would post its
          # refusal comment on a pull request that is already closed.
          json=$(curl -sS --connect-timeout 5 --max-time 20 --retry 2 --retry-delay 1 \
                   --retry-connrefused -H "Authorization: token ${TOKEN}" \
                   "$api/repos/$repo/pulls/${NUMBER}" 2>/dev/null || true)
          if printf '%s' "${json:-}" | grep -q '"merged":true'; then
            echo "#${NUMBER}: already merged - there is nothing left to arm"
            exit 0
          fi
          if printf '%s' "${json:-}" | grep -q '"state":"closed"'; then
            echo "#${NUMBER}: closed - there is nothing left to arm"
            exit 0
          fi
          # `needs` is ordering, not the verdict: each job of this workflow posts its own
          # commit status, so a leg that failed is already visible in the set read below,
          # and a leg skipped for a data-only diff simply is not in it. Reading the set
          # rather than `needs.*.result` also means this job agrees with the server about
          # what "green" is, which is the only definition that keeps the gate honest.

          # The same question the server would ask, asked while the answer is still
          # knowable, and with a floor on the set: the three test legs must be in it.
          got=$(curl -sS --connect-timeout 5 --max-time 20 --retry 2 --retry-delay 1 \
                  --retry-connrefused -H "Authorization: token ${TOKEN}" \
                  "$api/repos/$repo/commits/${HEAD_SHA}/status" 2>/dev/null || true)
          if [ -z "$got" ]; then
            note "#${NUMBER}: not merging - the checks for ${HEAD_SHA} could not be read"
            exit 0
          fi
          verdict=$(printf '%s' "$got" | node -e '
            let d = "";
            process.stdin.on("data", (c) => { d += c; });
            process.stdin.on("end", () => {
              let j; try { j = JSON.parse(d); } catch (e) { console.log("the status reply was not JSON"); return; }
              // The reader has its own status, `pending` while it runs, and that is
              // on the change - it is this decision. Everything else on the head has to
              // have reported, and reported green.
              const s = (j.statuses || []).filter((x) => !/^CI \/ Arm auto-merge/.test(x.context || ""));
              const legs = s.filter((x) => /^CI \/ Test \(Node \d+\)/.test(x.context || "")).length;
              const bad  = s.filter((x) => x.status !== "success");
              if (!s.length)  { console.log("no check has reported yet"); return; }
              if (bad.length) { console.log("not successful: " + bad.map((x) => (x.context || "?") + "=" + x.status).join(", ")); return; }
              if (legs < 3)   { console.log("only " + legs + " of the three CI test legs have reported"); return; }
              console.log("");
            });
          ')
          if [ -n "$verdict" ]; then
            note "#${NUMBER}: not merging - ${verdict}"
            exit 0
          fi
          echo "#${NUMBER}: every check on ${HEAD_SHA} is green - arming the merge"

          # This job cannot be the one that merges, and the last three pull requests are
          # the proof. Measured, 2026-11-18:
          #
          #   #2026 (run 6627, arm green 20:29:48-20:30:15), #2027 (run 6629), #2028
          #   (run 6631): eight statuses, all `success`, `mergeable: true` - and none of
          #   them merged. The same merge POST from outside the run, at 20:38:13 against
          #   8/8 green statuses, merged #2029 immediately.
          #
          # The difference between the two callers is this job's own commit status, which
          # is `pending` while the step runs. Forgejo validates the merge against every
          # status on the head commit, so the caller's own pending check is the one check
          # that says "not green" - the POST is answered 405 with an empty body, which is
          # why three attempts twelve seconds apart changed nothing: the answer could not
          # change until the job, and therefore its check, had finished. A retry loop
          # inside a check cannot outrun its own status.
          #
          # `merge_when_checks_succeed` is the request that means what this step has
          # always meant: merge when the checks are green, which includes the check this
          # job is currently failing to be. It is also exactly what the two scheduled
          # passes (auto-rebase.yml, pr-rebase.yml) already send, so a pull request armed
          # here is armed the same way it would have been armed minutes later - it just
          # stops waiting for someone else to ask.
          #
          # What this does not do: it does not merge anything this step has not verified.
          # The status-set reader above is unchanged (every status on the head must be
          # `success`, and all three `CI / Test (Node *)` legs must be in the set), and
          # `head_commit_id` still pins the commit whose checks were read, so a head that
          # has moved since cannot be merged by a decision made here.
          #
          # A refusal is reported with the server's own words and, because this job's log
          # needs a login to read, on the pull request itself. Nothing is retried: a
          # second identical request against a server that has already answered is how
          # this gate came to spend 30-57 s per pull request not merging (tasks 17222,
          # 17238, 17247).
          # The credential goes in `${TOKEN}`, and it must stay an expansion of the
          # environment variable. For 7.5 hours this line carried the three literal
          # characters `***` - the shape a masking tool leaves behind when a token is
          # written through it - so the request presented `***` as its token and the
          # server answered 401 "access token does not exist". The status read above
          # still worked, because this repository is readable anonymously, so the gate
          # went on reporting "every check is green - arming" and arming nothing. If an
          # edit ever shows `***` here again, it is that bug and not a placeholder.
          body="${RUNNER_TEMP:-/tmp}/merge-body.json"
          code=$(curl -sS --connect-timeout 5 --max-time 20 --retry 2 --retry-delay 1 \
                   --retry-connrefused -o "$body" -w '%{http_code}' -X POST \
                   -H "Authorization: token ${TOKEN}" -H 'Content-Type: application/json' \
                   "$api/repos/$repo/pulls/${NUMBER}/merge" \
                   -d "{\"Do\":\"squash\",\"head_commit_id\":\"${HEAD_SHA}\",\"merge_when_checks_succeed\":true}" 2>/dev/null || echo 000)
          why=$(tr -d '\r\n' < "$body" 2>/dev/null | cut -c1-300)
          case "$code" in
            200|201)
              echo "#${NUMBER}: armed for a squash merge of ${HEAD_SHA} - every check on it is green" ;;
            409)
              # 409 on this endpoint is two different answers: "already scheduled to
              # auto merge" (nothing to do) and "head out of date" (this head cannot be
              # armed until it is rebased, and the scheduled pass will do it). Printing
              # "already armed" for both was a log that said nothing was wrong while
              # nothing was armed - the server's own words decide which it was.
              case "$why" in
                *"already scheduled"*|*"already been merged"*)
                  echo "#${NUMBER}: already armed for ${HEAD_SHA} (HTTP 409) - nothing to do" ;;
                *)
                  note "#${NUMBER}: the arm was refused (HTTP 409) ${why}" ;;
              esac ;;
            *)
              # The reason a green gate did not arm belongs where a person looks: this
              # job's own status is `success` by design, the log needs a login, and a
              # `::warning::` is an annotation nobody opens. One comment, only on refusal.
              note "#${NUMBER}: every check on ${HEAD_SHA} is green and the arm was refused (HTTP ${code}) ${why}"
              # A credential the server does not recognise is not transient: it answers the
              # same 401 for every pull request until someone replaces the token, and a
              # `success` from this job then means nothing at all. That is not hypothetical:
              # between 2026-11-18T20:57Z and 2026-11-19T04:26Z every arm that reached this
              # POST - 78 of them, runs 6667 through 7081 - was answered 401 "access token
              # does not exist" because this line sent the literal string `***` instead of
              # the token, and the job reported success on all 78 while four green pull
              # requests (#2085-#2088) sat open. So a 401/403 is named as a failure here.
              # Every other refusal (405, 409 body, 5xx) stays green-with-a-comment: those
              # are the server's answer about this pull request and resolve themselves.
              case "$code" in
                401|403)
                  echo "::error title=Auto-merge::#${NUMBER}: the arm was refused (HTTP ${code}) - the workflow's token was not accepted, so no pull request on this head can merge until it is replaced"
                  exit 1 ;;
              esac
              comment=$(node -e '
                process.stdout.write(JSON.stringify({
                  body: "**Arm auto-merge went green but could not arm this pull request.**\n\n"
                    + "Every status on `" + process.argv[1] + "` is `success`, so the gate\n"
                    + "approved the change; the arm call was refused:\n\n"
                    + "```\nHTTP " + process.argv[2] + " " + process.argv[3] + "\n```\n\n"
                    + "The branch is untouched and the scheduled pass will try again. This\n"
                    + "comment exists because the job log needs a login to read."
                }));
              ' "$HEAD_SHA" "$code" "$why")
              curl -sS --connect-timeout 5 --max-time 20 --retry 2 --retry-delay 1 \
                   --retry-connrefused -o /dev/null -X POST \
                   -H "Authorization: token ${TOKEN}" -H 'Content-Type: application/json' \
                   "$api/repos/$repo/issues/${NUMBER}/comments" -d "$comment" 2>/dev/null ||
                echo "#${NUMBER}: could not post the reason as a comment" ;;
          esac
