name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Merging through the API does not reach the runner as a push event, so `main`
  # is the branch nothing verifies. This makes that a choice rather than a gap:
  # the same matrix can be run against any branch on demand.
  workflow_dispatch:

permissions:
  contents: read

# A pull request that gets rebased or amended starts a new run, but the run it
# superseded stays in the queue and is still executed. On this host there is a
# single runner, so those dead runs are not free: they are the difference between
# the queue draining in hours and in days, and they report on a commit nobody
# will merge. Cancel the superseded run instead of paying for it.
#
# Pushes to main are never cancelled - each one describes a different commit and
# a cancelled push run is a gap in the history of the default branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A job that hangs holds the only runner, and a held runner is a queue that
  # stops moving: issue #930 documents a task stuck in `running` for over forty
  # minutes while every other pull request waited behind it. A bound does not make
  # the job faster, it makes the failure cost ten minutes instead of an afternoon.
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check (all JS)
        run: node scripts/syntax-check.js
      - name: No control bytes in source
        run: node scripts/check-control-bytes.js
      - name: No API newer than the Node 18 floor
        # A green suite on the newest Node means nothing for the oldest matrix job, and that
        # failure reads like a flaky runner rather than "you used a Node 20 API".
        run: node scripts/check-node-surface.js
      - name: Every project URL points at Forgejo
        # The project moved and the links did not follow: the README said to clone from GitHub and
        # SECURITY.md sent reports to a GitHub advisory page. Nothing failed, because a stale URL
        # looks like every other string in the repo.
        run: node scripts/check-canonical-urls.js
      - name: Full test suite
        run: npm test
      - name: Build & verify example labs
        run: node examples/build-examples.js
      - name: Every lab model exists in the catalogue
        run: node scripts/missing-devices.js examples --no-issues

  smoke:
    name: Server smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Drive the API end to end
        run: node scripts/smoke-http.js

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # This job used to be a bare `docker build`. The runner's job image is
      # node:20-bookworm, which has no docker binary and no /var/run/docker.sock, so the
      # step could not succeed for any change - a red check on every pull request for
      # reasons unrelated to the code. The Dockerfile is checked statically first, which
      # catches everything a build would catch early; the real build then runs wherever a
      # daemon actually exists, and says so plainly where it does not.
      - name: Dockerfile static checks
        run: node scripts/check-dockerfile.js
      - name: Build image (only where a docker daemon is available)
        run: |
          if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
            echo "docker daemon found - building the image for real"
            docker build -t packetforge:ci .
          else
            echo "No docker daemon in this job image (no docker binary, no docker socket)."
            echo "The Dockerfile passed the static checks above."
            echo "The image build is verified on runners that provide a daemon."
          fi
