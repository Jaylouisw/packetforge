name: Wiki sync

# `docs/wiki/` is the source of truth for the wiki; the wiki itself is a
# separate git repository (<owner>/<repo>.wiki). This workflow mirrors the two
# on every push to `main` that touches a wiki page, so a PR can review a wiki
# change the same way it reviews code and the published wiki never drifts.
#
# Why a dedicated token: the Actions token (secrets.GITHUB_TOKEN) is scoped to
# this repository. The wiki is a different repository, so pushing to it needs a
# credential of its own - a Forgejo access token with write access to the wiki
# repo, stored here as the `WIKI_TOKEN` secret.

on:
  push:
    branches: [main]
    paths:
      - 'docs/wiki/**'
  workflow_dispatch:

permissions:
  contents: read

# A sync, not a test: only the newest commit's content matters, so a newer run
# may cancel an older one. The push is a single atomic ref update, so a run
# cancelled mid-push cannot leave the wiki half-updated.
concurrency:
  group: wiki-sync
  cancel-in-progress: true

jobs:
  sync:
    name: Mirror docs/wiki into the wiki repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No `actions/checkout` here, for the two reasons the other five workflows in this
      # directory already give - this was the last one still paying for it.
      #
      # Cost. The runner pre-clones every `uses:` action into /data/.cache/act, one
      # directory per action revision, before a job's first step, and it does not reuse
      # that clone between runs - on the same volume Forgejo's own data lives on, the
      # volume that has already filled once. That is the price of a tree this job only
      # needs for `docs/wiki/*.md`.
      #
      # Reliability. Two clones of the same revision into the same path, seconds apart,
      # is the one failure in this pipeline that has put a red X on a green tree:
      # run 3122 task 6834 died with `Unable to checkout ...: remove
      # /data/.cache/act/e5/877e.../.gitignore: no such file or directory` while its
      # siblings ran the identical suite to completion. No action, no shared cache
      # directory, no race.
      #
      # `git` is in the image and this job needs one commit. Same fetch as
      # close-merged-issues.yml and closed-audit.yml: shallow, detached, credentials
      # per command through an inline helper so nothing is written into .git/config,
      # with a 120 s bound because `timeout-minutes` above is not a bound this runner
      # enforces (ci.yml documents three tasks that outlived it).
      - name: Check out this commit, from git
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN || github.token }}
        run: |
          set -eu
          server="${GITHUB_SERVER_URL:-}"
          if [ -z "$server" ]; then
            api="${GITHUB_API_URL:-http://10.0.10.20:3000/api/v1}"
            server="${api%/api/v1}"
          fi
          url="${server}/${GITHUB_REPOSITORY}.git"
          sha="${{ github.sha }}"
          git init -q .
          git remote add origin "$url"
          if [ -n "${TOKEN:-}" ]; then
            timeout 120 git -c credential.helper='!f() { echo username=pf-ci; echo "password=${TOKEN}"; }; f' \
              -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=30 fetch -q --depth=1 origin "$sha"
          else
            timeout 120 git -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=30 fetch -q --depth=1 origin "$sha"
          fi
          git checkout -q -f --detach FETCH_HEAD
          git clean -qfdx
          echo "checked out $(git rev-parse HEAD) of ${url} with git - no action cache involved"

      - name: Push docs/wiki to the wiki repository
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${WIKI_TOKEN:-}" ]; then
            echo "WIKI_TOKEN secret is not set - cannot push to the wiki" >&2
            exit 1
          fi

          # Derive the wiki repo's HTTP URL from the origin the checkout action
          # gave us, so the host is exactly the one this runner can already
          # reach, whatever the instance advertises to its runners.
          origin="$(git remote get-url origin)"
          case "$origin" in
            http://*|https://*) ;;
            *) echo "origin is not an http(s) remote ($origin); cannot push" >&2; exit 1 ;;
          esac
          scheme="${origin%%://*}"
          rest="${origin#*://}"            # host[:port]/owner/repo.git
          host="${rest%%/*}"               # host[:port]
          path="${rest#*/}"                # owner/repo.git
          owner="${path%%/*}"
          repo="${path##*/}"; repo="${repo%.git}"
          wiki_url="${scheme}://git:${WIKI_TOKEN}@${host}/${owner}/${repo}.wiki.git"

          # Both of this job's git calls are bounded, because `timeout-minutes: 5` at the
          # top is a label on this runner rather than a kill: task 14673 (run 5763, pull
          # #1915) held a slot for 6363 s against a 10-minute bound. A peer that accepts
          # the connection and then stops answering is the stall this host produced twice
          # on 2026-11-18, and an unbounded clone of the wiki is that stall holding a
          # runner slot for as long as it likes. 90 s against a job that takes 11 s end
          # to end (task 23222, run 9263, a dispatch of this workflow on main) is not a
          # slow-network tripwire; a timeout here is reported as a timeout and fails the
          # step.
          if ! timeout --signal=TERM --kill-after=15 90 git clone --quiet "$wiki_url" wiki; then
            echo "::error title=Wiki sync::the wiki repository could not be cloned in 90 s - the sync did not run, and the next docs/wiki push will try again" >&2
            exit 1
          fi
          cd wiki

          # `main` is the branch Forgejo renders. Land on it explicitly in case
          # the wiki repo's HEAD points elsewhere.
          if git show-ref --verify --quiet refs/remotes/origin/main; then
            git checkout -q -B main origin/main
          else
            git checkout -q --orphan main
          fi

          # Mirror, not append: drop pages that no longer exist upstream, then
          # copy the current set. The wiki holds only markdown pages.
          for f in *.md; do
            [ -e "$f" ] || continue
            if [ ! -f "$GITHUB_WORKSPACE/docs/wiki/$f" ]; then
              git rm -q --ignore-unmatch "$f"
            fi
          done
          cp "$GITHUB_WORKSPACE"/docs/wiki/*.md .
          git add -A

          if git diff --cached --quiet; then
            echo "Wiki already matches docs/wiki - nothing to push."
            exit 0
          fi

          git -c user.name='packetforge-bot' \
              -c user.email='packetforge@localhost' \
              commit -q -m "Sync from docs/wiki (${GITHUB_SHA})"
          if ! timeout --signal=TERM --kill-after=15 90 git push -q origin main; then
            echo "::error title=Wiki sync::the push to the wiki repository did not finish in 90 s" >&2
            exit 1
          fi
          echo "Pushed wiki at ${GITHUB_SHA}."
