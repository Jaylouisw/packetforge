name: Closed request audit

# Six requests were closed as "impossible to model" while the catalogue already had every one of
# them (#54, #167, #360, #362, #374, #387). The sweeper could not catch it: it only looks at OPEN
# issues, so closing a request removes it from every automated view and the mistake becomes
# permanent and invisible.
#
# This audits the other side of the ledger - closed requests matched against the catalogue - and
# prints any close that has a match in `devices/` but no comment naming the file. It does not
# reopen or close anything, and it does not fail the build: a report nobody can act on because
# the pipeline is red is worse than no report.
#
# Triggered on push to main because `schedule:` never reaches a runner on this instance (see
# docs/FORGE_TROUBLESHOOTING.md). Every merge re-checks the recent past, which is enough - the
# backlog of bad closes only grows when somebody closes something.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      limit:
        description: 'How many closed requests to check'
        required: false
        default: '120'

concurrency:
  group: closed-audit-${{ github.sha }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # No `actions/checkout`. The runner pre-clones every `uses:` action into
      # /data/.cache/act before a job's first step - one directory per action revision,
      # not reused between runs - so this job, which fires on every push to main, paid
      # for a clone of the same revision ~150 times a day on the volume Forgejo stores
      # its own data on. ci.yml and pr-rebase.yml dropped the action for that reason and
      # for the second one: two jobs cloning the same revision at the same second is
      # what gave run 3122 task 6834 a red X on a green tree (`Unable to checkout ...:
      # remove /data/.cache/act/.../.gitignore: no such file or directory`) while its
      # two siblings ran the identical commit to completion. This is the last workflow
      # job that still paid it on every merge.
      #
      # Measured over the 150 successful audit jobs in the 24 h to 2026-11-17 20:20
      # (/actions/tasks): median 13 s, p10 11 s, p90 16 s - for one API read and one
      # catalogue match, a few seconds of work. In ci.yml's legs the clone alone was
      # 4.7-10.2 s of the job, before the action's own fetch of the tree; `git` is in
      # the runner image and this job needs exactly one commit.
      #
      # Coverage is unchanged: the same commit is checked out, depth 1, because that is
      # what the action checked out for this job too (it has no fetch-depth). The tree
      # is what the audit reads, and the credentials are passed per command with `-c`
      # rather than written into .git/config.
      #
      # A fetch that fails stops the job here instead of letting the audit read an empty
      # tree and print "no bad closes" - the one answer this check exists to disprove.
      - name: Check out this commit, from git
        env:
          TOKEN: ${{ secrets.FORGEJO_TOKEN || secrets.GITHUB_TOKEN || github.token }}
        run: |
          set -eu
          server="${GITHUB_SERVER_URL:-}"
          if [ -z "$server" ]; then
            api="${GITHUB_API_URL:-http://10.0.10.20:3000/api/v1}"
            server="${api%/api/v1}"
          fi
          url="${server}/${GITHUB_REPOSITORY}.git"
          sha="${{ github.sha }}"
          git init -q .
          git remote add origin "$url"
          if [ -n "${TOKEN:-}" ]; then
            timeout 120 git -c "http.extraheader=Authorization: token ${TOKEN}" -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=30 fetch -q --depth=1 origin "$sha"
          else
            timeout 120 git -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=30 fetch -q --depth=1 origin "$sha"
          fi
          git checkout -q -f --detach FETCH_HEAD
          # The runner may leave files of its own in the workspace; after this line the
          # tree is the commit's own files and nothing else.
          git clean -qfdx
          echo "checked out $(git rev-parse HEAD) of ${url} with git - no action cache involved"

      # No setup-node here, for the reason ci.yml already removed it from the `smoke` job and
      # from the `Test (Node *)` legs: every job in this repository already runs on Node 20,
      # because the runner's `ubuntu-latest` image is `node:20-bookworm`. Downloading Node 20
      # onto Node 20 was most of a 48 s `smoke` job (median 48.5 s over 22 jobs, tasks
      # 7312-7608, against 22 s for the `docker` job that does more work) and 25 s of a 229 s
      # test leg (run 3122, task 6833).
      #
      # This audit kept the step and paid the same price on every merge: over the 185
      # successful audit jobs recorded up to task 8071 (median 32 s, the twelve most recent
      # 28-39 s) the script itself accounts for a few seconds and the runtime download for the
      # rest. Nothing here needs a package install or a Node version different from the image's:
      # the script is plain Node with three `require`s and no dependency in `node_modules`.
      #
      # Two smaller costs go with it. `setup-node` is one more action for the runner to clone
      # into /data/.cache/act, on the same volume that has already filled once, once per action
      # revision (ci.yml documents the checkout collision that caused: run 3122, task 6834).
      # And this job fires on **every push to main**, so the download is paid per merge, not
      # per pull request.
      #
      # The runtime is printed rather than asserted, following the `smoke` job: this job's job
      # is an API read, the Node 18/20/22 matrix is what pins the runtime, and a bumped image
      # should be visible in the log rather than a red check that blocks an unrelated merge.
      - name: Which runtime is running this
        run: node --version

      - name: Audit closed requests against the catalogue
        # A missing token is reported as a skip, not a failure: the audit needs API reads on the
        # issue tracker, and a fork or a scoped run should not paint the branch red for it.
        env:
          TOKEN: ${{ secrets.FORGEJO_TOKEN || secrets.GITHUB_TOKEN || github.token }}
          LIMIT: ${{ github.event.inputs.limit || '120' }}
        run: |
          if [ -z "${TOKEN}" ]; then
            echo "no token available - skipping the closed-request audit"
            exit 0
          fi
          # `timeout-minutes: 10` at the top of this job is not a bound this runner
          # enforces (ci.yml documents three tasks that ran 12-15 minutes past it), and
          # this script makes one API read per closed request, so a stalled reply holds
          # the slot until something outside the runner kills the container - and then
          # there is no log to say why. The script itself is a few seconds' work in a
          # 13 s job, so 240 s is roughly twenty times its slowest observed run. A
          # timeout is reported as a timeout, not as a clean audit.
          set +e
          timeout --signal=TERM --kill-after=15 240             env FORGEJO_TOKEN="${TOKEN}" node scripts/check-closed-issues.js --limit "${LIMIT}" --max-age-days 400
          rc=$?
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
            echo "::error title=Closed request audit::the audit was still running after 240 s and was stopped - it has never taken more than a few seconds"
            exit 1
          fi
          exit "$rc"
