name: PR rebase

# Rebase a pull request onto `main` when it falls behind, then arm squash
# auto-merge so it lands the moment its checks pass.
#
# Why this triggers on pull_request and not on push to main:
#
# Auto-rebase.yml triggers on `push: [main]`, which is the right *moment* — when main
# moves, every open pull request is stale by definition. On this instance it is not a
# trigger that runs. Measured, not guessed: twenty-seven push runs did start in one
# day, and every one of them started when the pull-request queue was empty. During a
# merge burst the push runs for ci.yml, auto-rebase and two probe workflows that
# differed only in their `permissions:` block all sat at `waiting` with
# `started = 0`, forever. It is not permissions, and it is not one workflow.
#
# `pull_request` events do dispatch, reliably, under any load. So the rebase happens
# here, once per pull request, at the moments a pull request can become stale: when it
# is opened, when it is pushed to, and when it is reopened. A backlog therefore drains
# itself even while the queue is saturated, which is the only time it matters.
#
# The loop this could cause is closed by the first check: if the branch is not behind
# `main`, the job does nothing. Our own force-push produces a `synchronize` event, the
# job runs again, finds zero commits behind, and stops.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

# Per pull request, not global: one rebase per branch, and a newer push supersedes an
# older rebase of the same branch. Different pull requests never block each other.
concurrency:
  group: pr-rebase-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rebase:
    name: Rebase onto main and arm auto-merge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A branch in another repository cannot be pushed to with this token, and a rebase
    # we cannot push is not worth running. `head.repo` is null once the branch has been
    # deleted, and comparing through a null used to end the whole job as a failure
    # rather than a skip; the state guard stops a run against a pull request that has
    # already been merged or closed.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      # No `actions/checkout`. Two measured reasons, both paid by every one of this
      # job's ~750 daily runs, most of which find "0 commit(s) behind main" and do
      # nothing at all.
      #
      # Cost. The runner pre-clones every `uses:` action into /data/.cache/act before a
      # job's first step, one directory per action revision, and does not reuse that
      # clone between runs: run 4513, task 10575 - a run whose whole answer was "0
      # commit(s) behind main" - spent 02:15:55.7 -> 02:16:01.8 (6.1 s) cloning
      # actions/checkout and 02:16:04.3 -> 02:16:12.7 (8.4 s) in its
      # `git fetch --prune ... +refs/heads/*:refs/remotes/origin/*`, which is 792 refs
      # at full depth, for a job that reasons about exactly two commits. The two git
      # commands that decide the outcome took 2.3 s. Out of a 22.0 s job, 14.5 s was
      # getting ready to think. Across 24 h that is 752 tasks and ~3 runner-hours a day.
      #
      # Size. Measured against this instance from the same host class: all refs at full
      # depth is 17.3 MiB / 19,155 objects; `main` plus one pull-request head with
      # `--filter=blob:none` is 1.4 MiB, and `git rev-list --count` - the only thing the
      # no-op path needs - answers identically on it, because it reads commits and
      # nothing else. The file contents are fetched on demand, which only happens below
      # when the branch really is behind and the rebase has to replay it.
      #
      # What does not change: the two commits are the same two commits, the count is the
      # same count, and the credentials are passed per command with `-c` rather than
      # written into .git/config. If the fetch fails the next step says so and exits 0,
      # exactly as it did when the checkout action was what failed.
      - name: Fetch the two commits this job reasons about
        env:
          TOKEN: ${{ secrets.FORGEJO_TOKEN || secrets.GITHUB_TOKEN || github.token }}
        run: |
          set -eu
          server="${GITHUB_SERVER_URL:-}"
          if [ -z "$server" ]; then
            api="${GITHUB_API_URL:-http://10.0.10.20:3000/api/v1}"
            server="${api%/api/v1}"
          fi
          url="${server}/${GITHUB_REPOSITORY}.git"
          sha="${{ github.event.pull_request.head.sha }}"
          ref="${{ github.event.pull_request.head.ref }}"
          git init -q .
          git remote add origin "$url"
          # Every network call in this file carries its own ceiling, because this runner
          # does not enforce `timeout-minutes`: task 14673 (run 5763, pull #1915) started at
          # 00:07:30 and was still holding one of this host's two slots at 01:53:33 - 6363 s
          # against a 10-minute bound - and finished `failure`, a red X on a pull request
          # with nothing wrong with it. The two fetches below were the only calls in this
          # step with neither a timeout nor a low-speed abort (step 2 exports these; this
          # step did not), and git's own default is to wait forever for a peer that accepts
          # the connection and then stops answering - the stall this host produced twice on
          # 2026-11-18, once as 40 s of silence and once as a refused connection. The
          # low-speed abort is the same one that unblocked the demo deploy script. Nothing
          # about the result changes: a fetch that trips it was not going to finish, and the
          # fail-open path below already reports that and leaves the branch untouched.
          export GIT_TERMINAL_PROMPT=0
          export GIT_HTTP_LOW_SPEED_LIMIT=1000
          export GIT_HTTP_LOW_SPEED_TIME=30
          # `blob:none` is a request, not a requirement: a server that does not know the
          # filter answers with a warning and the full pack, and every command below
          # still works. Sending everything is what the action did anyway.
          fetch() {
            if [ -n "${TOKEN:-}" ]; then
              timeout 90 git -c "http.extraheader=Authorization: token ${TOKEN}" fetch -q --no-tags --filter=blob:none origin "$@"
            else
              timeout 90 git fetch -q --no-tags --filter=blob:none origin "$@"
            fi
          }
          # The head by sha, and the branch name as the fallback for an instance that
          # refuses a bare sha - this is the same pair ci.yml fetches per test leg.
          #
          # Fails open, like every other failure path in this workflow: a maintenance job
          # must not be the reason a pull request looks broken. The next step fetches
          # `main` again on its own and reports its own failure, so a transient error
          # here costs one retry rather than a red X.
          if ! fetch "+refs/heads/main:refs/remotes/origin/main" "$sha"; then
            if ! fetch "+refs/heads/main:refs/remotes/origin/main" "refs/heads/${ref}"; then
              echo "::warning title=Auto-rebase::could not fetch ${sha} or ${ref} - nothing was rebased and the branch is untouched."
              exit 0
            fi
          fi
          if ! git rev-parse --verify --quiet "${sha}^{commit}" >/dev/null; then
            echo "::warning title=Auto-rebase::the fetch did not produce ${sha} - nothing was rebased and the branch is untouched."
            exit 0
          fi
          echo "fetched main and ${sha} (blobless) - no working tree yet"

      - name: Rebase if behind, then arm
        env:
          # Three candidates, in order of preference:
          #
          #   FORGEJO_TOKEN  a repository secret holding a real token with write access
          #   GITHUB_TOKEN   the automatic Actions token (exists, but is scoped)
          #   github.token   the same value under its other name
          #
          # The automatic token is enough for the API reads and for arming, but on this
          # instance it has proven unable to push to a branch, and a rebase that cannot
          # be pushed is the whole job. A repository secret is the reliable path, and it
          # is what wiki-sync.yml already uses for the same reason.
          TOKEN: ${{ secrets.FORGEJO_TOKEN || secrets.GITHUB_TOKEN || github.token }}
        run: |
          # The default shell here is `bash -e`, and this script inherited it. That is the
          # whole reason pull request #1198 collected a red X nobody could act on: one
          # command near the top returned non-zero, `-e` aborted the step, and the failure
          # reporter below could only say "the rebase job itself failed before it could
          # report a reason". A maintenance job that explains nothing is worse than one
          # that prints a skippable warning, so `-e` is off and the commands whose result
          # matters are checked by hand.
          set +e
          set -u

          api="${GITHUB_API_URL:-http://10.0.10.20:3000/api/v1}"
          repo="$GITHUB_REPOSITORY"
          number="${{ github.event.pull_request.number }}"
          head_ref="${{ github.event.pull_request.head.ref }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          server="${GITHUB_SERVER_URL:-http://10.0.10.20:3000}"

          # A maintenance job must never be the reason a pull request looks broken.
          # Every failure path below reports itself as a `::warning::` and exits 0, so
          # the check goes green and the human reads an explanation instead of a red X
          # they cannot act on. The only thing worth failing on is a defect in this
          # workflow itself, and that is silent either way.
          warn() {
            echo "::warning title=Auto-rebase::${*}" >&2
            echo "${*}" >&2
            # Keep a copy for the reporting step below. Logs for a failed run on this
            # instance are behind a login, so the pull request comment is the only
            # place a failure can explain itself to whoever is looking.
            [ -n "${GITHUB_WORKSPACE:-}" ] && printf '%s\n' "${*}" >> "${GITHUB_WORKSPACE}/.rebase-report"
            return 0
          }

          # The conditions the job was handed, written before any command can fail, so an
          # early death still leaves an explanation behind. The token appears as a length,
          # never as a value.
          # Written to stdout and to the report file, not through warn(): this is not a
          # problem, and a yellow annotation on every healthy pull request teaches people
          # to ignore the annotations that matter.
          diagnostics="started: repository=${GITHUB_REPOSITORY:-unset} api=${api} pull=${number} branch=${head_ref:-unset} token=${#TOKEN}chars runner=${RUNNER_NAME:-unset}"
          echo "${diagnostics}"
          echo "${diagnostics}" > "${GITHUB_WORKSPACE}/.rebase-report"

          if [ -z "${TOKEN:-}" ]; then
            warn "no token available to the workflow - set the FORGEJO_TOKEN repository secret (Settings -> Actions -> Secrets) to a token with repository write access. The rebase and the auto-merge arming both need it; without it this job does nothing."
            exit 0
          fi

          auth() { printf 'Authorization: token %s' "$TOKEN"; }

          # Everything below talks to a host that stalls rather than refuses, and every
          # call to it is bounded here for that reason.
          #
          # The measurement: task 6299 (run 2890, pull request #1549) took 847 s against a
          # 22 s median for this job, spent its entire 10-minute budget, came back `failure`
          # on a pull request whose branch was never touched, and left no comment - the
          # `if: failure()` reporter two steps down never ran, because a timeout kill skips
          # the steps after it. It also held one of this host's two runner slots for
          # fourteen minutes while #1549's own checks sat pending throughout.
          #
          # The mechanism, measured rather than guessed: an unresponsive peer costs a bare
          # `curl` 21.03 s before it gives up on this host (curl -sS to 10.255.255.1:
          # "Failed to connect ... after 21029 ms"), and 130 s on a Linux runner with the
          # default SYN retry count. The mergeable poll below spent that call up to twelve
          # times with a 10 s sleep between them - 12 x (21 + 10) = 372 s of waiting before
          # it had done anything - with the checkout and both git calls unbounded on top.
          #
          # So: 20 s per call, five seconds to connect, and retries only where the
          # connection was refused. A stalled API now costs this job a line in the log after
          # 20 s instead of a red X after ten minutes.
          http() {
            curl -sS --connect-timeout 5 --max-time 20 --retry 2 --retry-delay 1 --retry-connrefused "$@"
          }

          # `timeout` is coreutils and is in every runner image this job has used; if it is
          # ever missing, run the command unbounded rather than fail the job over a wrapper.
          bounded() {
            bounded_seconds="$1"; shift
            if command -v timeout >/dev/null 2>&1; then timeout "$bounded_seconds" "$@"; else "$@"; fi
          }

          # The same bound for git, whose own default is to wait forever: give up when the
          # transfer drops below 1 KB/s for 30 s, and never prompt for credentials.
          export GIT_TERMINAL_PROMPT=0
          export GIT_HTTP_LOW_SPEED_LIMIT=1000
          export GIT_HTTP_LOW_SPEED_TIME=30

          # A merged or closed pull request must not be rebased or armed. The push would
          # fire a `synchronize` event, and that starts the whole matrix - three ~200 s
          # test legs, the smoke test and the Docker build - against a branch nobody will
          # merge. On 2026-11-16 that is where a large share of the runner's time went:
          # #1560 merged at 01:35:12 and its rebase task 6606 still ran at 02:23:12, and
          # #1545 merged at 01:00:11 while its test legs (tasks 6586-6588) ran from 02:10:53.
          #
          # The guard is here, not in the job `if:`, because #1172 measured the other
          # version: gating the job on `pull_request.state` stopped it being dispatched for
          # healthy pull requests as well. This one fails open by construction - the reply
          # is requested first, and only an explicit `"merged":true` or `"state":"closed"`
          # stops the run. A timeout, a 404, a 502 or an unexpected shape rebases exactly
          # as before.
          pr_json=$(http -H "$(auth)" "$api/repos/$repo/pulls/$number" 2>/dev/null || true)
          if printf '%s' "$pr_json" | grep -q '"merged":true'; then
            echo "#${number}: already merged - not rebasing and not arming"
            exit 0
          fi
          if printf '%s' "$pr_json" | grep -q '"state":"closed"'; then
            echo "#${number}: closed - not rebasing and not arming"
            exit 0
          fi

          git config user.name  'packetforge-bot'
          git config user.email 'packetforge-bot@users.noreply.git.jayw.uk'

          # The fetch step above added origin as a bare URL and passes whatever
          # credentials it had per command, so nothing is left in .git/config.
          # The token goes on the remote for this job only; the workspace is discarded
          # with the container.
          host="${server#http://}"; host="${host#https://}"
          git remote set-url origin "http://packetforge-bot:${TOKEN}@${host}/${repo}.git"
          git remote set-url --push origin "http://packetforge-bot:${TOKEN}@${host}/${repo}.git"

          if ! bounded 120 git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'; then
            warn "#${number}: could not fetch main, so nothing was rebased and the branch is untouched. A runner or network problem, not a problem with the change."
            exit 0
          fi

          # No working tree, no HEAD: the count is a question about commits, so it is
          # asked of the commits. This is also the whole of the no-op path - the branch
          # that is already on top of main never checks anything out, which is what
          # makes the common answer cheap.
          behind=$(git rev-list --count "${head_sha}..refs/remotes/origin/main" || echo 0)
          echo "#${number}: ${behind} commit(s) behind main"

          if [ "$behind" -gt 0 ]; then
            # Only now is a working tree needed, and only now is it paid for: the
            # checkout pulls the file contents the replay needs, lazily, in one batch.
            if ! bounded 120 git checkout -q -f --detach "${head_sha}"; then
              warn "#${number}: could not check out ${head_sha}, so nothing was rebased and the branch is untouched. A runner or network problem, not a problem with the change."
              exit 0
            fi
            # `bounded` rather than a bare call: the clone is `blob:none`, so the replay
            # fetches the file contents it needs from the same host, and a rebase that
            # waits on a stalled server is a held runner slot. 180 s is the same ceiling
            # `git push` and the `git fetch` above got.
            rebase_rc=0
            bounded 180 git rebase refs/remotes/origin/main || rebase_rc=$?
            if [ "$rebase_rc" -eq 0 ]; then
              # force-with-lease against the exact head we checked out, so a push that
              # landed while this job was running is never overwritten.
              host="${server#http://}"; host="${host#https://}"
              git remote set-url origin "http://packetforge-bot:${TOKEN}@${host}/${repo}.git"
              if bounded 180 git push \
                   --force-with-lease="refs/heads/${head_ref}:${head_sha}" \
                   origin "HEAD:refs/heads/${head_ref}"; then
                echo "rebased and pushed #${number}"
              else
                # Not a failure of the pull request: the branch moved underneath us, or
                # this token cannot write. Say so and stay green.
                warn "#${number}: the rebase could not be pushed, so the branch was left exactly as the author wrote it. This is not a problem with the change."
                exit 0
              fi
            else
              # A conflict is a decision about behaviour, so it is reported rather
              # than guessed at. Leave the branch exactly as the author wrote it.
              git rebase --abort || true
              # A timeout is not a conflict, and reporting it as one would send the
              # author looking for a clash that does not exist. 124 is `timeout`'s own
              # status, 137 its --kill-after escalation.
              if [ "$rebase_rc" -eq 124 ] || [ "$rebase_rc" -eq 137 ]; then
                warn "#${number}: rebasing took longer than 180 s and was stopped, so the branch is untouched and nothing was reported as a conflict. A stalled host rather than a problem with the change."
                exit 0
              fi
              # The files this branch touches - the likely conflict site - rather than
              # a diff against main, which after an aborted rebase would list main's
              # own changes.
              base=$(git merge-base HEAD refs/remotes/origin/main || echo '')
              files=$(git diff --name-only "$base" HEAD | head -20 | tr '\n' ' ')
              http -X POST -H "$(auth)" -H 'Content-Type: application/json' \
                "$api/repos/$repo/issues/$number/comments" \
                -d "$(printf '{"body":"This branch conflicts with `main`, so it was not rebased:\\n\\n```\\n%s\\n```\\n\\nA conflict is a decision about behaviour rather than a mechanical fix, so this is left for a human. Rebasing by hand and force-pushing will let the automation pick it up again."}' "$files")" >/dev/null
              echo "conflict on #${number} - reported, not touched"
              exit 0
            fi
          fi

          # Before arming: a head that was pushed seconds ago has no checks, and
          # `merge_when_checks_succeed` is evaluated against the checks that exist when
          # the call is made - so arming it there is not a gate, it is a merge. "All
          # checks succeeded" over an empty set is true, and the pull request landed
          # before CI had reported anything.
          #
          # Measured on 2026-11-16 through `/commits/{sha}/status` over the 25 most
          # recently merged pull requests: all 25 merged before any of their seven checks
          # reported, and 15 of them had no status at all on the head commit at merge
          # time. #1719 is the clearest: this job (run 4092) armed it at 19:59:43, Forgejo
          # merged at 19:59:54, and its own CI run 4091 did not finish its first test leg
          # until 20:00:46 - 52 s after the commit it was testing was on `main`.
          #
          # So arming here is conditional on the checks already being green, which for a
          # branch this job just rebased they are not; that pull request is merged by
          # ci.yml's `Arm auto-merge` job, the one of the two that runs after the checks
          # it depends on. Green here still arms, which is what keeps a pull request that
          # lost its arm from sitting mergeable and unarmed.
          checks_green() {   # $1 = head sha; exit 0 only when every reported check passed
            st=$(http -H "$(auth)" "$api/repos/$repo/commits/$1/status" 2>/dev/null || true)
            [ -z "$st" ] && return 1
            printf '%s' "$st" | node -e '
              let d = "";
              process.stdin.on("data", (c) => { d += c; });
              process.stdin.on("end", () => {
                let j; try { j = JSON.parse(d); } catch (e) { process.exit(1); }
                // The reader has its own status, `pending` while it runs, and that is not a
                // check on the change - it is this decision. Everything else on the head
                // has to have reported, and reported green.
                const s = (j.statuses || []).filter((x) => !/^PR rebase \//.test(x.context || ""));
                const legs = s.filter((x) => /^CI \/ Test \(Node \d+\)/.test(x.context || "")).length;
                const bad  = s.filter((x) => x.status !== "success");
                process.exit(s.length && !bad.length && legs >= 3 ? 0 : 1);
              });'
          }

          if ! checks_green "$head_sha"; then
            echo "#${number}: checks on ${head_sha} are not green yet - ci.yml's 'Arm auto-merge' job merges this once they are"
            exit 0
          fi

          # Arming: Forgejo computes `mergeable` asynchronously, so arming in the same
          # breath as the push answers 405 "Please try again later" - which reads like
          # a refusal and is only "not computed yet". Poll until it settles.
          # Against the wall clock, not against a count. Twelve iterations is only a bound
          # if the call inside each one is bounded too, and that is the assumption run 2890
          # broke.
          deadline=$((SECONDS + 120))
          while [ "$SECONDS" -lt "$deadline" ]; do
            state=$(http -H "$(auth)" "$api/repos/$repo/pulls/$number" \
              | tr ',' '\n' | grep -m1 '"mergeable"' | cut -d: -f2 | tr -d ' ' || true)
            if [ "$state" = "true" ]; then
              # The payload names the commit this run checked, so a head that has
              # moved since cannot be merged by a stale decision.
              payload=$(printf '{"Do":"squash","head_commit_id":"%s","merge_when_checks_succeed":true}' "$head_sha")
              code=$(http -o /dev/null -w '%{http_code}' -X POST -H "$(auth)" -H 'Content-Type: application/json' "$api/repos/$repo/pulls/$number/merge" -d "$payload")
              # 409 is "already armed", which is the outcome asked for either way.
              case "$code" in
                200|201|409) echo "#${number}: armed (HTTP ${code})" ;;
                *)           echo "#${number}: arm refused (HTTP ${code}) - the scheduled pass retries" ;;
              esac
              exit 0
            fi
            sleep 5
          done

          # Not a failure, and deliberately not a `::warning::` either: the branch is
          # untouched, the scheduled pass in auto-rebase.yml arms whatever this one missed,
          # and a yellow annotation on a healthy pull request is how people learn to ignore
          # annotations.
          echo "#${number}: mergeable did not settle within 120s - not armed this time"

      # Logs for a failed run on this instance sit behind a login, which makes a red
      # check unreadable: the person who filed the pull request sees ✗ and nothing else.
      # So on failure the note the step collected above is posted where it will be read.
      - name: Explain the failure on the pull request
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TOKEN: ${{ secrets.FORGEJO_TOKEN || secrets.GITHUB_TOKEN || github.token }}
        run: |
          set -u
          api="${GITHUB_API_URL:-http://10.0.10.20:3000/api/v1}"
          repo="$GITHUB_REPOSITORY"
          number="${{ github.event.pull_request.number }}"
          note="$(cat "${GITHUB_WORKSPACE}/.rebase-report" 2>/dev/null || echo '')"
          [ -z "$note" ] && note="the rebase job itself failed before it could report a reason - check the runner."
          body=$(node -e '
            const note = process.argv[1];
            process.stdout.write(JSON.stringify({
              body: "**The auto-rebase job failed.** This is a problem with the automation, not with this change.\n\n"
                + "```\n" + note + "\n```\n\n"
                + "The run is at " + (process.env.RUN_URL || "the Actions tab") + ". "
                + "Nothing was pushed, so the branch is exactly as you wrote it."
            }));
          ' "$note")
          http -o /dev/null -w 'comment: HTTP %{http_code}\n' -X POST \
            -H "Authorization: token ${TOKEN:-}" -H 'Content-Type: application/json' \
            "${api}/repos/${repo}/issues/${number}/comments" -d "$body"
