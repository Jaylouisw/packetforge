name: PR rebase

# Rebase a pull request onto `main` when it falls behind, then arm squash
# auto-merge so it lands the moment its checks pass.
#
# Why this triggers on pull_request and not on push to main:
#
# Auto-rebase.yml triggers on `push: [main]`, which is the right *moment* — when main
# moves, every open pull request is stale by definition. On this instance it is not a
# trigger that runs. Measured, not guessed: twenty-seven push runs did start in one
# day, and every one of them started when the pull-request queue was empty. During a
# merge burst the push runs for ci.yml, auto-rebase and two probe workflows that
# differed only in their `permissions:` block all sat at `waiting` with
# `started = 0`, forever. It is not permissions, and it is not one workflow.
#
# `pull_request` events do dispatch, reliably, under any load. So the rebase happens
# here, once per pull request, at the moments a pull request can become stale: when it
# is opened, when it is pushed to, and when it is reopened. A backlog therefore drains
# itself even while the queue is saturated, which is the only time it matters.
#
# The loop this could cause is closed by the first check: if the branch is not behind
# `main`, the job does nothing. Our own force-push produces a `synchronize` event, the
# job runs again, finds zero commits behind, and stops.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

# Per pull request, not global: one rebase per branch, and a newer push supersedes an
# older rebase of the same branch. Different pull requests never block each other.
concurrency:
  group: pr-rebase-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rebase:
    name: Rebase onto main and arm auto-merge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A branch in another repository cannot be pushed to with this token, and a rebase
    # we cannot push is not worth running. `head.repo` is null once the branch has been
    # deleted, and comparing through a null used to end the whole job as a failure
    # rather than a skip; the state guard stops a run against a pull request that has
    # already been merged or closed.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Rebase if behind, then arm
        env:
          # Three candidates, in order of preference:
          #
          #   FORGEJO_TOKEN  a repository secret holding a real token with write access
          #   GITHUB_TOKEN   the automatic Actions token (exists, but is scoped)
          #   github.token   the same value under its other name
          #
          # The automatic token is enough for the API reads and for arming, but on this
          # instance it has proven unable to push to a branch, and a rebase that cannot
          # be pushed is the whole job. A repository secret is the reliable path, and it
          # is what wiki-sync.yml already uses for the same reason.
          TOKEN: ${{ secrets.FORGEJO_TOKEN || secrets.GITHUB_TOKEN || github.token }}
        run: |
          # The default shell here is `bash -e`, and this script inherited it. That is the
          # whole reason pull request #1198 collected a red X nobody could act on: one
          # command near the top returned non-zero, `-e` aborted the step, and the failure
          # reporter below could only say "the rebase job itself failed before it could
          # report a reason". A maintenance job that explains nothing is worse than one
          # that prints a skippable warning, so `-e` is off and the commands whose result
          # matters are checked by hand.
          set +e
          set -u

          api="${GITHUB_API_URL:-http://10.0.10.20:3000/api/v1}"
          repo="$GITHUB_REPOSITORY"
          number="${{ github.event.pull_request.number }}"
          head_ref="${{ github.event.pull_request.head.ref }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          server="${GITHUB_SERVER_URL:-http://10.0.10.20:3000}"

          # A maintenance job must never be the reason a pull request looks broken.
          # Every failure path below reports itself as a `::warning::` and exits 0, so
          # the check goes green and the human reads an explanation instead of a red X
          # they cannot act on. The only thing worth failing on is a defect in this
          # workflow itself, and that is silent either way.
          warn() {
            echo "::warning title=Auto-rebase::${*}" >&2
            echo "${*}" >&2
            # Keep a copy for the reporting step below. Logs for a failed run on this
            # instance are behind a login, so the pull request comment is the only
            # place a failure can explain itself to whoever is looking.
            [ -n "${GITHUB_WORKSPACE:-}" ] && printf '%s\n' "${*}" >> "${GITHUB_WORKSPACE}/.rebase-report"
            return 0
          }

          # The conditions the job was handed, written before any command can fail, so an
          # early death still leaves an explanation behind. The token appears as a length,
          # never as a value.
          # Written to stdout and to the report file, not through warn(): this is not a
          # problem, and a yellow annotation on every healthy pull request teaches people
          # to ignore the annotations that matter.
          diagnostics="started: repository=${GITHUB_REPOSITORY:-unset} api=${api} pull=${number} branch=${head_ref:-unset} token=${#TOKEN}chars runner=${RUNNER_NAME:-unset}"
          echo "${diagnostics}"
          echo "${diagnostics}" > "${GITHUB_WORKSPACE}/.rebase-report"

          if [ -z "${TOKEN:-}" ]; then
            warn "no token available to the workflow - set the FORGEJO_TOKEN repository secret (Settings -> Actions -> Secrets) to a token with repository write access. The rebase and the auto-merge arming both need it; without it this job does nothing."
            exit 0
          fi

          auth() { printf 'Authorization: token %s' "$TOKEN"; }

          git config user.name  'packetforge-bot'
          git config user.email 'packetforge-bot@users.noreply.git.jayw.uk'

          # checkout ran with persist-credentials: false, so origin is a bare URL.
          # The token goes on the remote for this job only; the workspace is discarded
          # with the container.
          host="${server#http://}"; host="${host#https://}"
          git remote set-url origin "http://packetforge-bot:${TOKEN}@${host}/${repo}.git"
          git remote set-url --push origin "http://packetforge-bot:${TOKEN}@${host}/${repo}.git"

          if ! git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'; then
            warn "#${number}: could not fetch main, so nothing was rebased and the branch is untouched. A runner or network problem, not a problem with the change."
            exit 0
          fi

          behind=$(git rev-list --count "HEAD..refs/remotes/origin/main" || echo 0)
          echo "#${number}: ${behind} commit(s) behind main"

          if [ "$behind" -gt 0 ]; then
            if git rebase refs/remotes/origin/main; then
              # force-with-lease against the exact head we checked out, so a push that
              # landed while this job was running is never overwritten.
              host="${server#http://}"; host="${host#https://}"
              git remote set-url origin "http://packetforge-bot:${TOKEN}@${host}/${repo}.git"
              if git push \
                   --force-with-lease="refs/heads/${head_ref}:${head_sha}" \
                   origin "HEAD:refs/heads/${head_ref}"; then
                echo "rebased and pushed #${number}"
              else
                # Not a failure of the pull request: the branch moved underneath us, or
                # this token cannot write. Say so and stay green.
                warn "#${number}: the rebase could not be pushed, so the branch was left exactly as the author wrote it. This is not a problem with the change."
                exit 0
              fi
            else
              # A conflict is a decision about behaviour, so it is reported rather
              # than guessed at. Leave the branch exactly as the author wrote it.
              git rebase --abort || true
              # The files this branch touches - the likely conflict site - rather than
              # a diff against main, which after an aborted rebase would list main's
              # own changes.
              base=$(git merge-base HEAD refs/remotes/origin/main || echo '')
              files=$(git diff --name-only "$base" HEAD | head -20 | tr '\n' ' ')
              curl -sS -X POST -H "$(auth)" -H 'Content-Type: application/json' \
                "$api/repos/$repo/issues/$number/comments" \
                -d "$(printf '{"body":"This branch conflicts with `main`, so it was not rebased:\\n\\n```\\n%s\\n```\\n\\nA conflict is a decision about behaviour rather than a mechanical fix, so this is left for a human. Rebasing by hand and force-pushing will let the automation pick it up again."}' "$files")" >/dev/null
              echo "conflict on #${number} - reported, not touched"
              exit 0
            fi
          fi

          # Arming: Forgejo computes `mergeable` asynchronously, so arming in the same
          # breath as the push answers 405 "Please try again later" - which reads like
          # a refusal and is only "not computed yet". Poll until it settles.
          i=0
          while [ "$i" -lt 12 ]; do
            state=$(curl -sS -H "$(auth)" "$api/repos/$repo/pulls/$number" \
              | tr ',' '\n' | grep -m1 '"mergeable"' | cut -d: -f2 | tr -d ' ' || true)
            if [ "$state" = "true" ]; then
              code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H "$(auth)" \
                -H 'Content-Type: application/json' \
                "$api/repos/$repo/pulls/$number/merge" \
                -d '{"Do":"squash","merge_when_checks_succeed":true}')
              echo "#${number}: armed (HTTP ${code})"
              exit 0
            fi
            i=$((i + 1))
            sleep 10
          done

          echo "#${number}: mergeable did not settle in 120s - not armed this time"

      # Logs for a failed run on this instance sit behind a login, which makes a red
      # check unreadable: the person who filed the pull request sees ✗ and nothing else.
      # So on failure the note the step collected above is posted where it will be read.
      - name: Explain the failure on the pull request
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TOKEN: ${{ secrets.FORGEJO_TOKEN || secrets.GITHUB_TOKEN || github.token }}
        run: |
          set -u
          api="${GITHUB_API_URL:-http://10.0.10.20:3000/api/v1}"
          repo="$GITHUB_REPOSITORY"
          number="${{ github.event.pull_request.number }}"
          note="$(cat "${GITHUB_WORKSPACE}/.rebase-report" 2>/dev/null || echo '')"
          [ -z "$note" ] && note="the rebase job itself failed before it could report a reason - check the runner."
          body=$(node -e '
            const note = process.argv[1];
            process.stdout.write(JSON.stringify({
              body: "**The auto-rebase job failed.** This is a problem with the automation, not with this change.\n\n"
                + "```\n" + note + "\n```\n\n"
                + "The run is at " + (process.env.RUN_URL || "the Actions tab") + ". "
                + "Nothing was pushed, so the branch is exactly as you wrote it."
            }));
          ' "$note")
          curl -sS -o /dev/null -w 'comment: HTTP %{http_code}\n' -X POST \
            -H "Authorization: token ${TOKEN:-}" -H 'Content-Type: application/json' \
            "${api}/repos/${repo}/issues/${number}/comments" -d "$body"
