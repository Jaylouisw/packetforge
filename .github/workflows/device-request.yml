name: Device request triage

# Every hardware request gets an immediate acknowledgement with the checklist it
# will be judged against, so the requester knows what is missing before a
# maintainer looks at it. Idempotent: editing an issue does not re-comment.

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  acknowledge:
    if: contains(github.event.issue.title, '[Device]') || contains(toJSON(github.event.issue.labels), 'device-request')
    runs-on: ubuntu-latest
    steps:
      - name: Label and acknowledge
        uses: actions/github-script@v8
        with:
          script: |
            const marker = '<!-- pf-hardware-request -->';
            const issue = context.issue;
            const body = context.payload.issue.body || '';

            // Ensure the label exists on the issue (the template sets it, but
            // hand-filed issues will not have it).
            try {
              await github.rest.issues.addLabels({
                owner: issue.owner, repo: issue.repo,
                issue_number: issue.number,
                labels: ['device-request']
              });
            } catch (e) {
              core.warning('could not add label: ' + e.message);
            }

            // Reflect "blocked on a datasheet" in the labels, so the queue can be
            // filtered for requests that still need a link. Runs on every open/edit,
            // independent of the comment-marker idempotency below.
            const hasUrl = /https?:\/\//i.test(body);
            try {
              if (hasUrl) {
                await github.rest.issues.removeLabel({
                  owner: issue.owner, repo: issue.repo,
                  issue_number: issue.number,
                  name: 'needs-datasheet'
                });
              } else {
                await github.rest.issues.addLabels({
                  owner: issue.owner, repo: issue.repo,
                  issue_number: issue.number,
                  labels: ['needs-datasheet']
                });
              }
            } catch (e) {
              // 404 = the label was not present to remove; that is fine.
              if (e.status !== 404) {
                core.warning('could not update needs-datasheet label: ' + e.message);
              }
            }

            const comments = await github.rest.issues.listComments({
              owner: issue.owner, repo: issue.repo, issue_number: issue.number
            });
            const already = comments.data.some(c => (c.body || '').includes(marker));
            if (already) return;

            const missing = [];
            if (!hasUrl) missing.push('a datasheet or product page URL');
            if (!/(rj45|ethernet|sfp|qsfp|gbe|ge |10g|1g)/i.test(body)) missing.push('a port list with speeds');

            const text = [
              marker,
              'Thanks for the request. Here is how this gets handled.',
              '',
              '**What happens next**',
              '1. A maintainer checks the datasheet against the port list. We do not guess port counts — an entry with invented ports is worse than no entry, because the simulator will confidently refuse a cable that real hardware accepts.',
              '2. The device is added as a single JSON file under `devices/<vendor>/`. No code changes are needed for a new model.',
              '3. `test/hardware-invariants.test.js` runs over the whole catalogue in CI: it will fail if the description promises ports the interfaces do not have, if two ports share a name, or if an optical cage is modelled as copper.',
              '',
              missing.length
                ? '**Still needed:** ' + missing.join(' and ') + '. A request without a datasheet usually stalls, because we will not invent hardware.'
                : '**Looks complete** — a datasheet and a port list are both present, so this can go straight in.',
              '',
              '**Want to do it yourself?** Copy an existing file in `devices/` and open a PR. The rules are in [docs/DEVICE_REGISTRY.md](https://github.com/' + issue.owner + '/' + issue.repo + '/blob/main/docs/DEVICE_REGISTRY.md).',
              '',
              '_This comment was posted automatically. A human follows up._'
            ].join('\n');

            await github.rest.issues.createComment({
              owner: issue.owner, repo: issue.repo, issue_number: issue.number, body: text
            });
