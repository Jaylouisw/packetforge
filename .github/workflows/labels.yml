name: Labels

# Keeps the repository's labels in sync with .github/labels.yml (the single
# source of truth). Runs when the file changes and on demand from the Actions
# tab. skip-delete keeps any pre-existing labels that are not listed here, so a
# sync never silently removes a label the templates or dependabot still rely on.

on:
  push:
    paths:
      - .github/labels.yml
  workflow_dispatch:

permissions:
  issues: write

jobs:
  sync:
    name: Sync labels
    runs-on: ubuntu-latest
    if: github.server_url == 'https://github.com'
    steps:
      - uses: actions/checkout@v7
      - name: Sync labels from .github/labels.yml
        uses: crazy-max/ghaction-github-labeler@v5
        with:
          yml-file: .github/labels.yml
          skip-delete: true
