name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check (all JS)
        run: node scripts/syntax-check.js

      # Issue #11: a scripted edit collapsed a backslash into a literal backspace, so
      # a word-boundary regex became a valid regex that matched nothing. node --check
      # cannot see that. Run this early so the failure names the file.
      - name: No control bytes in source
        run: node scripts/check-control-bytes.js
      - name: Engine + CLI + physical-layer + L2 tests
        run: npm test
      - name: Build & verify example labs
        run: node examples/build-examples.js

      # The labs are the specification for the catalogue: if a topology names a
      # model that is not under devices/, the maintainer rule says build it. Until
      # someone does, this step fails and prints the model, the labs that ask for
      # it and the skeleton to fill in -- so a lab can never quietly render
      # hardware that does not exist.
      - name: Every lab model exists in the catalogue
        run: node scripts/missing-devices.js examples --no-issues

  smoke:
    name: Server smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      # The old step proved that three endpoints return JSON. What the UI actually needs is a
      # topology it can create, a device it can place, a legal cable accepted, an illegal one
      # refused with reasons, and a dry run that agrees. scripts/smoke-http.js checks all of
      # that; it spawns its own server on a free port and cleans up after itself.
      - name: Drive the API end to end
        run: node scripts/smoke-http.js

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t packetforge:ci .

  # release.yml only triggers on a tag, so nothing ever validated it on a PR.
  # A dependabot bump that breaks the release workflow would stay invisible
  # until release day. This lints every workflow on every push instead.
  lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: actionlint (all workflows)
        run: |
          curl -sSfL -o actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          tar xzf actionlint.tar.gz actionlint
          ./actionlint -color
