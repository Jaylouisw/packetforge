name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Syntax check (all JS)
        run: node scripts/syntax-check.js
      - name: Engine + CLI + physical-layer tests
        run: npm test
      - name: Build & verify example labs
        run: node examples/build-examples.js

  smoke:
    name: Server smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Start server and probe API
        run: |
          PORT=8123 node server/index.js > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8123/api/catalog >/dev/null 2>&1 && break
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:8123/api/catalog | grep -q '"specs"'
          curl -fsS http://127.0.0.1:8123/ | grep -qi 'PacketForge'
          echo "smoke test passed"

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t packetforge:ci .
