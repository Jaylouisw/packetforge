name: Auto-rebase

# Keeps the PR queue draining itself: every run rebases each open PR onto the
# latest main and arms auto squash-merge, so a PR lands the moment its required
# checks pass. Conflicts are left for a human -- they cannot be auto-resolved.
#
# Runs on a schedule (only the copy on the default branch is used) and on demand
# from the Actions tab.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-rebase
  cancel-in-progress: false

jobs:
  rebase:
    name: Rebase open PRs and arm auto-merge
    runs-on: ubuntu-latest
    steps:
      - name: Rebase and arm
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          total=0; rebased=0; conflicts=0; armed=0
          for n in $(gh pr list --state open --json number -q '.[].number'); do
            total=$((total+1))
            # Rebase onto main. A "conflict" and "already up to date" both exit
            # non-zero, so read the message to tell them apart.
            msg=$(gh pr update-branch "$n" --rebase 2>&1)
            if printf '%s' "$msg" | grep -Eqi 'conflict'; then
              conflicts=$((conflicts+1))
              echo "PR #$n: rebase conflict (left for a human)"
              continue
            fi
            rebased=$((rebased+1))
            # Arm auto squash-merge; it lands once the checks pass.
            if gh pr merge "$n" --auto --squash --delete-branch >/dev/null 2>&1; then
              armed=$((armed+1))
            fi
          done
          echo "scanned=$total rebased_or_current=$rebased conflicts=$conflicts auto_armed=$armed"
