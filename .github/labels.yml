# PacketForge label catalogue.
#
# NOTHING SYNCS THIS FILE. It used to say a workflow at .github/workflows/labels.yml
# pushed it to the repository whenever it changed; that directory was deleted in #1059
# and .forgejo/workflows/ holds only ci.yml and auto-rebase.yml, so no workflow, script
# or npm alias in this tree reads this file. It is a wish list, not a source of truth.
#
# Measured 2026-11-12: the forge carries six labels -- bug, device, device-request,
# enhancement, needs-datasheet, and from-github. Eight declared below have never
# existed there (feature, documentation, ci, question, good first issue, help wanted,
# duplicate, wontfix), and the one label the bridge actually needs, from-github, is not
# declared here at all: gh-bridge.js creates it itself with ensureLabel('from-github',
# '#1f6feb', 'Opened on the GitHub mirror') on both the issue and PR paths.
#
# The issue templates reference labels by name (labels: [...]). Only device-request and
# device answer today (24 open issues carry both); enhancement exists but is applied to
# nothing. Read docs/REQUESTING-HARDWARE.md before writing a label filter.
#
# Colours are hex without the leading '#'.

- name: bug
  color: d73a4a
  description: Something is broken or behaves incorrectly

- name: feature
  color: 0e8a16
  description: A new capability that does not exist yet

- name: enhancement
  color: a2eeef
  description: An improvement to something that already works

- name: device
  color: 5319e7
  description: Relates to a device model in devices/

- name: device-request
  color: fbca04
  description: Request for new hardware to be added to the catalog

- name: documentation
  color: 0075ca
  description: Improvements or additions to docs/

- name: ci
  color: d4c5f9
  description: CI/CD, build, and developer tooling

- name: question
  color: d876e3
  description: Needs more information before it can be acted on

- name: needs-datasheet
  color: c5def5
  description: Device request blocked on a manufacturer datasheet

- name: good first issue
  color: 7057ff
  description: A good entry point for new contributors

- name: help wanted
  color: 008672
  description: Extra attention or maintainer time needed

- name: duplicate
  color: cfd3d7
  description: Already reported elsewhere

- name: wontfix
  color: ffffff
  description: Will not be addressed
