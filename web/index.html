<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PacketForge — Open Network Simulator</title>
  <link rel="stylesheet" href="style.css" />
  <!-- The faceplate view's own rules. Linked here so it can never become another
       orphaned stylesheet whose rules are written but never loaded. -->
  <link rel="stylesheet" href="faceplate.css" />
</head>
<body>
  <header id="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">◧</span>
      <span class="brand-name">Packet<strong>Forge</strong></span>
      <span class="tagline">vendor-agnostic network simulator</span>
    </div>
    <div class="topbar-actions">
      <button id="btn-new" class="btn" title="Start a new topology">New</button>
      <button id="btn-import" class="btn" title="Import a topology JSON">Import</button>
      <button id="btn-export" class="btn" title="Download topology JSON">Export</button>
      <button id="btn-reset" class="btn" title="Clear ARP/MAC tables">Reset state</button>
      <!-- An anchor, not a button: this is the one control that must still work when the
           JavaScript that would have upgraded it is exactly what broke. app.js fills in the
           build, browser and page on click; without app.js the link below still opens a
           usable report form. -->
      <a id="btn-bug" class="btn btn-quiet" target="_blank" rel="noopener"
         href="https://git.jayw.uk/jaylouisw/packetforge/issues/new?title=%5BBug%5D%3A%20&body=%23%23%23%20What%20happened%0A%0A%0A%23%23%23%20Steps%20to%20reproduce%0A%0A1.%20%0A2.%20%0A%0A%23%23%23%20Environment%0A%0A%3C%21--%20PacketForge%20version%2C%20browser%20and%20operating%20system.%20If%20the%20page%20did%20not%0Aload%20at%20all%2C%20say%20what%20you%20saw%20instead%20of%20the%20app.%20--%3E%0A"
         title="Report a bug — opens a pre-filled issue; your build and browser are added when the app is running"
         aria-label="Report a bug">Report a bug</a>
    </div>
  </header>

  <aside id="palette">
    <div class="palette-header">Device Catalog</div>
    <div id="palette-filters" class="palette-filters">
      <input id="pf-search" type="search" placeholder="Search vendor / model / type…" autocomplete="off" spellcheck="false" />
      <div class="pf-row">
        <select id="pf-vendor"><option value="">All vendors</option></select>
        <select id="pf-type"><option value="">All types</option></select>
      </div>
    </div>
    <div id="palette-list" class="palette-list"></div>
    <!-- Nine cable families are drawn in nine colours on the canvas (MEDIUM_RULES in
         canvas.js, the .link-* rules in style.css) and nothing said which was which.
         The key lives here in the palette rather than floating over the drawing, so it
         can never cover a device, and its collapsed state is kept in localStorage. -->
    <div id="cable-legend" class="cable-legend">
      <button id="legend-toggle" class="legend-toggle" type="button" aria-controls="legend-body" aria-expanded="true">
        <span id="legend-caret" class="legend-caret">▾</span>
        <span>Cable colours</span>
      </button>
      <div id="legend-body" class="legend-body"></div>
    </div>

    <div class="palette-footer">
      <span class="hint">Click a device, then click the canvas to place it.</span>
    </div>
  </aside>

  <main id="canvas-wrap">
    <svg id="canvas" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="3" result="b" />
          <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
        </filter>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#3f7cff" />
        </marker>
      </defs>
      <g id="world"></g>
      <g id="packets"></g>
      <g id="overlay"></g>
    </svg>
    <div id="canvas-toolbar">
      <button id="btn-zoom-in" class="mini" title="Zoom in">＋</button>
      <button id="btn-zoom-out" class="mini" title="Zoom out">－</button>
      <button id="btn-zoom-fit" class="mini" title="Fit to view">⛶</button>
      <span class="sep"></span>
      <!-- Device-first cabling (issue #68). Port-first asks you to know the socket before the
           engine will help; on a 48-port switch that is a guess, and a wrong guess is one
           error with no sight of the pairs that would have worked. -->
      <button id="btn-link" class="mini" title="Create link (C) - pick two devices, then a port pair">🔗</button>
      <span class="sep"></span>
      <span id="canvas-hint" class="hint">Scroll to zoom · drag to pan · click a device or cable to inspect · click a port to cable</span>
      <span class="sep"></span>
      <!-- Colour key for the port dots. Without it the tints are decoration; with it
           you can tell a fibre cage from a copper socket at a glance. -->
      <span class="legend" title="Port connector families">
        <span class="lg"><i style="background:#94a3b8"></i>copper</span>
        <span class="lg"><i style="background:#fbbf24"></i>fibre</span>
        <span class="lg"><i style="background:#e879f9"></i>combo</span>
        <span class="lg"><i style="background:#fb923c"></i>coax</span>
        <span class="lg"><i style="background:#34d399"></i>DSL</span>
        <span class="lg"><i style="background:#a78bfa"></i>console</span>
      </span>
    </div>
  </main>

  <aside id="inspector">
    <div class="tabs">
      <button class="tab active" data-tab="device">Inspect</button>
      <button class="tab" data-tab="console">Console</button>
      <button class="tab" data-tab="simulate">Simulate</button>
    </div>
    <div id="tab-device" class="tab-panel active"></div>
    <div id="tab-console" class="tab-panel">
      <div id="console-output" class="console-output"></div>
      <form id="console-form" class="console-form">
        <span id="console-prompt" class="console-prompt">&gt;</span>
        <input id="console-input" class="console-input" autocomplete="off" spellcheck="false" placeholder="type a command, e.g. show ip route" />
      </form>
    </div>
    <div id="tab-simulate" class="tab-panel"></div>
  </aside>

  <footer id="statusbar">
    <span id="status-left">Ready</span>
    <span id="conn-state" class="conn-badge conn-bad" title="Connecting to the server">connecting</span>
    <span id="status-right"></span>
  </footer>

  <div id="toast" class="toast hidden"></div>

  <!-- The context menu the canvas has always tried to open. app.js assigned to
       #context-menu's innerHTML, but no such element existed, so the assignment threw
       and the menu never appeared: the only visible "Delete device" was unreachable
       (issue #16). -->
  <div id="context-menu" class="context-menu"></div>

  <!-- The front-panel layout module, used by the device inspector. Loaded before
       app.js so the inspector can find window.PFFaceplate on its first render. -->
  <script src="faceplate.js"></script>
  <script src="canvas.js"></script>
  <script src="app.js"></script>
</body>
</html>
